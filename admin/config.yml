# 臺灣營德網站 — 內容管理後台設定
# ------------------------------------------------------------
# 這個檔案決定同事在後台看到哪些欄位。
# repo 請改成你自己的 GitHub 帳號/儲存庫名稱。

backend:
  name: github
  repo: yunna121/inteplast_home_page_tw
  branch: main

# 同事上傳的圖片會存到這裡
media_folder: src/product-img
public_folder: /src/product-img

locale: zh-Hant
publish_mode: simple

collections:
  # ============ 產品規格 ============
  - name: products
    label: 產品資料
    files:
      - name: specs
        label: 產品規格與照片
        file: content/products.json
        description: 網站上所有產品規格表的內容。順序＝這裡的排列順序。
        fields:
          - { name: version, label: 版本, widget: hidden, default: 1 }

          - name: specs
            label: 產品規格
            label_singular: 一筆規格
            widget: list
            summary: '{{fields.series}}　{{fields.cap}} {{fields.size}}　{{fields.dim}}'
            fields:
              - name: category
                label: 分類頁
                widget: select
                options: ['清潔袋', '拉繩袋', '蔬果袋', '夾鏈袋', '其他類', 'Scale Sheet']
              - { name: series, label: 產品系列, widget: string, hint: '例：連捲清潔袋。同系列會排在同一個表格' }
              - { name: cap, label: 容量／號數, widget: string, required: false, hint: '例：45L、0號、四兩' }
              - { name: size, label: 尺寸級別, widget: string, required: false, hint: '例：特小、中、超大' }
              - { name: dim, label: 尺寸（寬×長）, widget: string, required: false, hint: '例：84 × 95 cm' }
              - { name: count, label: 張數, widget: string, required: false, hint: '只填數字，例：100' }
              - { name: pack, label: 包裝, widget: string, required: false, hint: '例：張/捲、經濟包、箱/板' }
              - { name: colors, label: 顏色, widget: string, required: false, hint: '多色用 / 分隔，例：透明 / 粉紅 / 黑色' }
              - { name: img, label: 這筆規格的照片, widget: image, required: false, media_library: { choose_url: false } }
              - { name: cover, label: 系列代表圖, widget: image, required: false, hint: '只需填在該系列的第一筆' }
              - { name: blockTitle, label: 表格標題, widget: string, required: false, hint: '只需填在該系列的第一筆；留空就用產品系列名稱' }
              - { name: caption, label: 圖片說明, widget: string, required: false, hint: '只需填在該系列的第一筆，顯示在左側圖下方' }

          - name: categories
            label: 分類介紹
            widget: list
            summary: '{{fields.title_tw}}'
            fields:
              - { name: category, label: 分類頁, widget: string }
              - { name: title_tw, label: 中文名稱, widget: string }
              - { name: title_en, label: 英文名稱, widget: string, required: false }
              - { name: highlights, label: 核心亮點, widget: string, required: false }
              - { name: desc, label: 詳細介紹, widget: text, required: false }
              - { name: badges, label: 特色標籤, widget: string, required: false, hint: '用逗號分隔' }
              - { name: image, label: 產品中心卡片圖, widget: image, required: false }
              - { name: hero, label: 分類頁最上方大圖, widget: image, required: false }

          - name: search
            label: 搜尋設定
            widget: object
            collapsed: true
            fields:
              - { name: variants, label: 異體字對應, widget: hidden }
              - name: synonyms
                label: 搜尋同義詞
                widget: list
                summary: '{{fields.say}}'
                fields:
                  - { name: say, label: 客戶可能輸入的字, widget: list, hint: '例：垃圾袋、塑膠袋、trash bag' }
                  - { name: mean, label: 對應到的產品, widget: list }
              - { name: docs, label: 搜尋索引, widget: hidden }

  # ============ 網站設定 ============
  - name: settings
    label: 網站設定
    files:
      - name: site
        label: 公司資訊與詢價信箱
        file: content/site.json
        description: 改這裡會同時更新所有頁面的聯絡資訊與頁尾。
        fields:
          - { name: company_name, label: 公司名稱, widget: string }
          - { name: address, label: 公司地址, widget: string }
          - { name: phone, label: 總機電話（顯示用）, widget: string, hint: '例：02-2712-2211 #8109' }
          - { name: phone_link, label: 總機電話（撥號用）, widget: string, hint: '只留數字與逗號，例：0227122211,8109' }
          - { name: email, label: 詢價信箱收件人, widget: string }
          - { name: email_cc, label: 副本收件人, widget: string, required: false }
          - { name: copyright, label: 頁尾版權文字, widget: string }

  # ============ 頁面文字 ============
  - name: pages
    label: 頁面文字與圖片
    files:
      - name: pages
        label: 首頁／關於我們／永續發展／聯繫我們
        file: content/pages.json
        description: >
          「網頁上原本的字」是比對用的，請不要修改；把想改的內容填在「改成」欄位。
          留白代表沿用原本的文字。
        fields:
          - { name: version, label: 版本, widget: hidden, default: 1 }
          - name: pages
            label: 頁面
            widget: list
            summary: '{{fields.name}}'
            collapsed: true
            fields:
              - { name: id, label: 頁面代碼, widget: string, hint: '請勿修改' }
              - { name: name, label: 頁面名稱, widget: string }
              - name: texts
                label: 文字
                widget: list
                collapsed: true
                summary: '{{fields.from}}'
                fields:
                  - { name: from, label: 網頁上原本的字（請勿修改）, widget: text }
                  - { name: to, label: 改成, widget: text, required: false }
              - name: images
                label: 圖片
                widget: list
                collapsed: true
                summary: '{{fields.from}}'
                fields:
                  - { name: from, label: 原本的圖檔（請勿修改）, widget: string }
                  - { name: to, label: 換成, widget: image, required: false }
