<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>網站內容管理｜臺灣營德</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --navy: #0b4f83;
      --blue: #00529b;
      --azure: #0877ba;
      --ink: #142638;
      --muted: #5f7182;
      --line: #dbe4ec;
      --paper: #f4f7fa;
      --white: #fff;
      --good: #0f7a4e;
      --warn: #b45309;
      --bad: #b42318;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      color: var(--ink);
      background: var(--paper);
      line-height: 1.7;
      font-size: 15px;
    }

    button, input, textarea, select { font: inherit; color: inherit; }
    a { color: var(--blue); }

    /* ---------- 版面 ---------- */
    .shell { display: grid; grid-template-columns: 232px 1fr; min-height: 100vh; }

    .side {
      padding: 22px 16px;
      background: var(--navy);
      color: var(--white);
      display: flex;
      flex-direction: column;
      gap: 26px;
      position: sticky;
      top: 0;
      height: 100vh;
    }

    .brand { font-size: 1.05rem; font-weight: 900; line-height: 1.3; }
    .brand small { display: block; margin-top: 4px; color: #9fd3f2; font-size: .74rem; font-weight: 500; letter-spacing: .1em; }

    .nav { display: flex; flex-direction: column; gap: 3px; }

    .nav button {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: none;
      border: 0;
      border-radius: 6px;
      color: rgba(255, 255, 255, .78);
      font-size: .93rem;
      font-weight: 700;
      text-align: left;
      cursor: pointer;
    }

    .nav button i { width: 17px; text-align: center; font-size: .9rem; }
    .nav button:hover { background: rgba(255, 255, 255, .1); color: #fff; }
    .nav button.on { background: var(--white); color: var(--navy); }
    .nav .count { margin-left: auto; padding: 0 7px; background: rgba(255, 255, 255, .18); border-radius: 99px; font-size: .74rem; }
    .nav button.on .count { background: #e3effa; color: var(--blue); }

    .side-foot { margin-top: auto; font-size: .78rem; color: rgba(255, 255, 255, .55); }
    .side-foot a { display: inline-flex; align-items: center; gap: 6px; color: #9fd3f2; text-decoration: none; font-weight: 700; }

    .main { padding: 28px 34px 80px; min-width: 0; }

    .head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 22px; }
    .head h1 { font-size: 1.5rem; line-height: 1.25; letter-spacing: -.02em; }
    .head p { margin-top: 4px; color: var(--muted); font-size: .88rem; }

    /* ---------- 元件 ---------- */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 40px;
      padding: 8px 18px;
      background: var(--blue);
      border: 1px solid var(--blue);
      border-radius: 6px;
      color: var(--white);
      font-size: .9rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn:hover { background: var(--navy); border-color: var(--navy); }
    .btn.ghost { background: var(--white); border-color: var(--line); color: var(--ink); }
    .btn.ghost:hover { background: #eef4f9; border-color: var(--azure); color: var(--blue); }
    .btn.danger { background: var(--white); border-color: #f0c4c0; color: var(--bad); }
    .btn.danger:hover { background: var(--bad); border-color: var(--bad); color: var(--white); }
    .btn.sm { min-height: 32px; padding: 4px 12px; font-size: .82rem; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }

    .card { background: var(--white); border: 1px solid var(--line); border-radius: 10px; }
    .card + .card { margin-top: 14px; }

    .banner {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      padding: 14px 16px;
      margin-bottom: 20px;
      border-radius: 8px;
      font-size: .88rem;
      background: #fff4ed;
      border: 1px solid #f6cfae;
      color: #8a3d0b;
    }

    .banner.bad { background: #fdf2f2; border-color: #f3c9c5; color: #8f2018; }
    .banner i { margin-top: 3px; font-size: 1rem; }
    .banner b { display: block; margin-bottom: 2px; }

    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 11px 14px; text-align: left; vertical-align: middle; border-bottom: 1px solid #eef2f6; }
    th { color: var(--muted); font-size: .76rem; font-weight: 700; letter-spacing: .06em; background: #f8fafc; }
    tr:last-child td { border-bottom: 0; }
    td.right, th.right { text-align: right; white-space: nowrap; }
    .rowtitle { font-weight: 700; }
    .rowsub { color: var(--muted); font-size: .82rem; }

    .thumb { width: 46px; height: 46px; object-fit: cover; border-radius: 5px; background: #eef2f6; display: block; }
    .thumb.none { display: grid; place-items: center; color: #9db0c0; font-size: .8rem; }

    .chips { display: flex; flex-wrap: wrap; gap: 7px; }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 4px 6px 4px 12px;
      background: #eff6fb;
      border: 1px solid #cfe4f3;
      border-radius: 99px;
      font-size: .85rem;
      font-weight: 700;
      color: var(--blue);
      white-space: nowrap;
    }

    .chip button { width: 20px; height: 20px; display: grid; place-items: center; background: none; border: 0; border-radius: 50%; color: #7c98ad; cursor: pointer; font-size: .72rem; }
    .chip button:hover { background: #fdecea; color: var(--bad); }
    .chip.plain { background: #f4f7fa; border-color: var(--line); color: var(--ink); }

    .empty { padding: 40px 20px; text-align: center; color: var(--muted); }
    .empty i { display: block; margin-bottom: 10px; font-size: 1.6rem; color: #c3d2de; }

    /* ---------- 表單 ---------- */
    .field { padding: 14px 16px; border-bottom: 1px solid #eef2f6; }
    .field:last-child { border-bottom: 0; }
    .field > label { display: block; margin-bottom: 6px; font-size: .84rem; font-weight: 700; }
    .field .hint { margin-top: 5px; color: var(--muted); font-size: .78rem; }
    .field .req { color: var(--bad); }

    input[type=text], textarea, select {
      width: 100%;
      padding: 9px 12px;
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 6px;
    }

    input[type=text]:focus, textarea:focus, select:focus {
      outline: 0;
      border-color: var(--azure);
      box-shadow: 0 0 0 3px rgba(8, 119, 186, .13);
    }

    textarea { min-height: 88px; resize: vertical; line-height: 1.7; }

    .grid2 { display: grid; grid-template-columns: 1fr 1fr; }
    .grid2 > .field { border-right: 1px solid #eef2f6; }
    .grid2 > .field:nth-child(2n) { border-right: 0; }

    .tabs { display: flex; gap: 2px; padding: 10px 16px 0; background: #f8fafc; border-bottom: 1px solid var(--line); }

    .tabs button {
      padding: 8px 16px;
      background: none;
      border: 1px solid transparent;
      border-bottom: 0;
      border-radius: 7px 7px 0 0;
      color: var(--muted);
      font-size: .87rem;
      font-weight: 700;
      cursor: pointer;
      position: relative;
      top: 1px;
      white-space: nowrap;
    }

    .tabs button.on { background: var(--white); border-color: var(--line); color: var(--blue); }
    .tabs .dot { display: inline-block; width: 6px; height: 6px; margin-left: 6px; background: #e0a03a; border-radius: 50%; vertical-align: middle; }

    .sect-label { padding: 12px 16px; background: #f8fafc; border-bottom: 1px solid var(--line); font-size: .78rem; font-weight: 700; color: var(--muted); letter-spacing: .06em; }

    .formfoot { display: flex; align-items: center; gap: 10px; padding: 16px; background: #f8fafc; border-top: 1px solid var(--line); border-radius: 0 0 10px 10px; }
    .formfoot .spacer { margin-left: auto; }

    /* ---------- 圖片欄位 ---------- */
    .imgfield { display: flex; gap: 14px; align-items: flex-start; }
    .imgprev { width: 84px; height: 84px; flex: 0 0 84px; object-fit: cover; border: 1px solid var(--line); border-radius: 6px; background: #eef2f6; }
    .imgprev.none { display: grid; place-items: center; color: #9db0c0; font-size: 1.3rem; }
    .imgbody { flex: 1; min-width: 0; }
    .imgbody .row { display: flex; gap: 8px; margin-top: 8px; }

    /* ---------- 提示 ---------- */
    .toast {
      position: fixed;
      right: 22px;
      bottom: 22px;
      z-index: 90;
      display: flex;
      align-items: center;
      gap: 10px;
      max-width: 380px;
      padding: 13px 18px;
      background: var(--ink);
      border-radius: 8px;
      color: var(--white);
      font-size: .89rem;
      font-weight: 700;
      box-shadow: 0 14px 34px -12px rgba(10, 37, 64, .55);
      opacity: 0;
      transform: translateY(10px);
      transition: opacity .2s, transform .2s;
      pointer-events: none;
    }

    .toast.show { opacity: 1; transform: none; }
    .toast.ok { background: var(--good); }
    .toast.err { background: var(--bad); }

    .veil { position: fixed; inset: 0; z-index: 80; display: none; place-items: center; padding: 20px; background: rgba(10, 37, 64, .5); }
    .veil.show { display: grid; }
    .dialog { width: min(460px, 100%); padding: 24px; background: var(--white); border-radius: 10px; }
    .dialog h3 { font-size: 1.1rem; margin-bottom: 8px; }
    .dialog p { color: var(--muted); font-size: .88rem; }
    .dialog .acts { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }

    .loading { padding: 60px; text-align: center; color: var(--muted); }

    @media (max-width: 900px) {
      .shell { grid-template-columns: 1fr; }
      .side { position: static; height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; gap: 14px; }
      .nav { flex-direction: row; flex-wrap: wrap; }
      .side-foot { margin: 0; }
      .main { padding: 20px 16px 60px; }
      .grid2 { grid-template-columns: 1fr; }
      .grid2 > .field { border-right: 0; }
    }
  </style>
</head>

<body>
  <div class="shell">
    <aside class="side">
      <div class="brand">網站內容管理<small>INTEPLAST TAIWAN</small></div>
      <nav class="nav" id="nav"></nav>
      <div class="side-foot">
        <a href="/" target="_blank" rel="noopener"><i class="fa-solid fa-arrow-up-right-from-square"></i> 前往網站</a>
        <div style="margin-top:8px">改完存檔後，網站會立刻更新。</div>
        <div id="logoutBox" style="margin-top:10px"></div>
      </div>
    </aside>

    <main class="main" id="main">
      <div class="loading"><i class="fa-solid fa-circle-notch fa-spin"></i> 載入中…</div>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <div class="veil" id="veil">
    <div class="dialog">
      <h3 id="dlgTitle">確認</h3>
      <p id="dlgBody"></p>
      <div class="acts">
        <button class="btn ghost" id="dlgNo">取消</button>
        <button class="btn danger" id="dlgYes">確定刪除</button>
      </div>
    </div>
  </div>

  <script>
    /* ============================================================
       網站內容管理（Cloudflare D1）
       ------------------------------------------------------------
       資料一律經由 /api/admin/* 讀寫，這頁不直接碰資料庫。

       語言處理：繁體中文是基準語言，內容存在 products／timeline／
       settings 本表；其他語言存在 translations（一列＝某筆資料的
       某個欄位在某語言的內容）。所以新增語言只是多幾列資料 ——
       這頁的語言頁籤會自己長出來，不必改程式碼。
       ============================================================ */
    (function () {
      var DB = null;          // 後端撈回來的全部內容
      var view = 'product';   // 目前在哪一頁
      var editing = null;     // 正在編輯的資料（null＝清單模式）
      var activeLang = null;  // 表單裡目前選的語言

      var SPEC = {
        product: {
          title: '產品資料',
          lead: '首頁與產品中心的卡片都讀這裡。改完存檔，兩邊一起更新。',
          icon: 'fa-box-open',
          table: 'products',
          neutral: [
            { key: 'img', label: '產品中心圖片', type: 'image', hint: '滿版顯示，建議去背或正方構圖' },
            { key: 'img_home', label: '首頁圖片', type: 'image', hint: '留空就沿用上面那張' },
            { key: 'patent', label: '專利證書圖', type: 'image', hint: '沒有就留空' },
            { key: 'patent_no', label: '專利號', type: 'text', hint: '例：US 11,111,111 B2' }
          ],
          langFields: [
            { key: 'name', label: '產品名稱', type: 'text', required: true },
            { key: 'highlight', label: '重點一句話', type: 'text', hint: '顯示在名稱下方，字會放大' },
            { key: 'desc', label: '產品敘述', type: 'textarea' },
            { key: 'items', label: '產品細項', type: 'text', hint: '用「、」分隔，會顯示成一排標籤' }
          ]
        },
        timeline: {
          title: '時間軸',
          lead: '關於營德頁的「製造歷程」。年份順序由系統依數字自動排列。',
          icon: 'fa-clock-rotate-left',
          table: 'timeline',
          neutral: [
            { key: 'year', label: '年份', type: 'text', required: true, hint: '例：1989。要分兩行就在中間按 Enter' }
          ],
          langFields: [
            { key: 'title', label: '標題', type: 'text' },
            { key: 'description', label: '說明', type: 'textarea' },
            { key: 'future_outlook', label: '未來展望', type: 'textarea', hint: '填了這欄，該筆會顯示成特別樣式' }
          ]
        }
      };

      /* ---------- 工具 ---------- */
      function el(tag, attrs, kids) {
        var node = document.createElement(tag);
        Object.keys(attrs || {}).forEach(function (k) {
          if (k === 'class') node.className = attrs[k];
          else if (k === 'text') node.textContent = attrs[k];
          else if (k === 'html') node.innerHTML = attrs[k];
          else if (k.slice(0, 2) === 'on') node.addEventListener(k.slice(2), attrs[k]);
          else if (attrs[k] != null) node.setAttribute(k, attrs[k]);
        });
        (kids || []).forEach(function (kid) { if (kid) node.appendChild(kid); });
        return node;
      }

      function toast(message, kind) {
        var t = document.getElementById('toast');
        t.className = 'toast show ' + (kind || '');
        t.textContent = message;
        clearTimeout(toast.timer);
        toast.timer = setTimeout(function () { t.className = 'toast ' + (kind || ''); }, 3200);
      }

      function confirmDialog(title, body, onYes) {
        var veil = document.getElementById('veil');
        document.getElementById('dlgTitle').textContent = title;
        document.getElementById('dlgBody').textContent = body;
        veil.classList.add('show');
        var yes = document.getElementById('dlgYes');
        var no = document.getElementById('dlgNo');
        function close() {
          veil.classList.remove('show');
          yes.removeEventListener('click', go);
          no.removeEventListener('click', close);
        }
        function go() { close(); onYes(); }
        yes.addEventListener('click', go);
        no.addEventListener('click', close);
      }

      function baseLang() {
        var found = (DB.languages || []).filter(function (l) { return l.is_base; })[0];
        return found ? found.code : 'zh-TW';
      }

      function langLabel(code) {
        var found = (DB.languages || []).filter(function (l) { return l.code === code; })[0];
        return found ? found.label : code;
      }

      /** 某筆資料在某語言下某欄位的值 */
      function valueOf(entity, row, field, lang) {
        if (!row) return '';
        if (lang === baseLang()) return row[field] == null ? '' : String(row[field]);
        var hit = (DB.translations || []).filter(function (t) {
          return t.entity === entity && String(t.entity_id) === String(row.id) && t.field === field && t.lang === lang;
        })[0];
        return hit ? hit.value : '';
      }

      /** 這筆資料在這個語言下，翻譯是不是還沒填完 */
      function langIncomplete(entity, row, fields, lang) {
        if (lang === baseLang()) return false;
        return fields.some(function (f) {
          var zh = valueOf(entity, row, f.key, baseLang());
          return zh.trim() && !valueOf(entity, row, f.key, lang).trim();
        });
      }

      function api(path, body) {
        return fetch(path, {
          method: body ? 'POST' : 'GET',
          headers: body ? { 'content-type': 'application/json' } : undefined,
          body: body ? JSON.stringify(body) : undefined,
          cache: 'no-store'
        }).then(function (res) {
          return res.json().then(function (data) {
            if (!res.ok || data.error) {
              var err = new Error(data.error || ('HTTP ' + res.status));
              err.needLogin = !!data.needLogin;
              throw err;
            }
            return data;
          });
        });
      }

      /* 密碼登入畫面（沒設密碼、或用 Cloudflare Access 時不會出現） */
      function loginView(message) {
        document.getElementById('nav').innerHTML = '';
        var main = document.getElementById('main');
        main.innerHTML = '';

        var pass = el('input', { type: 'password', placeholder: '請輸入管理密碼', autofocus: 'autofocus' });
        var note = el('div', { class: 'hint', text: message || '' });
        var go = el('button', { class: 'btn' }, [el('i', { class: 'fa-solid fa-right-to-bracket' }), el('span', { text: '登入' })]);

        function submit() {
          if (!pass.value) { note.textContent = '請輸入密碼'; return; }
          go.disabled = true;
          api('/api/admin/login', { password: pass.value })
            .then(function () { go.disabled = false; return reload(); })
            .catch(function (err) {
              note.textContent = err.message;
              go.disabled = false;
              pass.value = '';
              pass.focus();
            });
        }

        pass.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); submit(); } });
        go.addEventListener('click', submit);

        main.appendChild(el('div', { style: 'max-width:420px;margin:8vh auto 0' }, [
          el('div', { class: 'card' }, [
            el('div', { class: 'sect-label', text: '網站內容管理' }),
            el('div', { class: 'field' }, [
              el('label', { text: '管理密碼' }),
              pass,
              note
            ]),
            el('div', { class: 'formfoot' }, [go])
          ])
        ]));
      }

      function reload() {
        return api('/api/admin/data').then(function (data) {
          DB = data;
          render();
        }).catch(function (err) {
          if (err.needLogin) { loginView(''); return; }
          document.getElementById('main').innerHTML =
            '<div class="banner bad"><i class="fa-solid fa-triangle-exclamation"></i><div>' +
            '<b>讀不到資料</b>' + err.message +
            '<div style="margin-top:8px">請確認資料庫已建立 v3 的資料表（db/schema-v3.sql），並且已重新部署。</div>' +
            '</div></div>';
        });
      }

      /* ---------- 側邊選單 ---------- */
      function renderNav() {
        var items = [
          { id: 'product', label: '產品資料', icon: 'fa-box-open', count: (DB.products || []).length },
          { id: 'synonym', label: '產品別名', icon: 'fa-tags', count: (DB.synonyms || []).length },
          { id: 'suggestion', label: '待審別名', icon: 'fa-wand-magic-sparkles', count: (DB.suggestions || []).length },
          { id: 'inquiry', label: '客戶詢價', icon: 'fa-envelope-open-text', count: (DB.inquiries || []).filter(function (q) { return q.status !== 'done'; }).length },
          { id: 'timeline', label: '時間軸', icon: 'fa-clock-rotate-left', count: (DB.timeline || []).length },
          { id: 'setting', label: '公司資訊', icon: 'fa-building', count: 0 },
          { id: 'language', label: '語言', icon: 'fa-language', count: (DB.languages || []).length }
        ];
        var nav = document.getElementById('nav');
        nav.innerHTML = '';
        items.forEach(function (item) {
          nav.appendChild(el('button', {
            class: view === item.id ? 'on' : '',
            onclick: function () { view = item.id; editing = null; render(); }
          }, [
            el('i', { class: 'fa-solid ' + item.icon }),
            el('span', { text: item.label }),
            item.count ? el('span', { class: 'count', text: String(item.count) }) : null
          ]));
        });
      }

      /* ---------- 表單欄位 ---------- */
      function fieldNode(spec, value, onInput) {
        var input;
        if (spec.type === 'textarea') {
          input = el('textarea', { oninput: function () { onInput(this.value); } });
          input.value = value;
        } else if (spec.type === 'image') {
          return imageField(spec, value, onInput);
        } else {
          input = el('input', { type: 'text', value: value, oninput: function () { onInput(this.value); } });
        }
        return el('div', { class: 'field' }, [
          el('label', {}, [
            el('span', { text: spec.label }),
            spec.required ? el('span', { class: 'req', text: ' *' }) : null
          ]),
          input,
          spec.hint ? el('div', { class: 'hint', text: spec.hint }) : null
        ]);
      }

      function imageSrc(value) {
        var raw = String(value || '').trim();
        if (!raw) return '';
        if (/^(https?:)?\/\//.test(raw) || raw.charAt(0) === '/') return raw;
        return '/src/product-img/' + raw;
      }

      function imageField(spec, value, onInput) {
        var preview = el('img', { class: 'imgprev', alt: '' });
        var text = el('input', { type: 'text', value: value, oninput: function () { onInput(this.value); paint(this.value); } });
        var file = el('input', { type: 'file', accept: 'image/*', style: 'display:none' });
        var wrap = el('div', { class: 'imgprev none' }, [el('i', { class: 'fa-regular fa-image' })]);

        function paint(v) {
          var src = imageSrc(v);
          if (src) {
            preview.src = src;
            if (wrap.parentNode) wrap.parentNode.replaceChild(preview, wrap);
          } else if (preview.parentNode) {
            preview.parentNode.replaceChild(wrap, preview);
          }
        }

        var upload = el('button', {
          class: 'btn ghost sm',
          type: 'button',
          onclick: function () { file.click(); }
        }, [el('i', { class: 'fa-solid fa-upload' }), el('span', { text: '上傳圖片' })]);

        file.addEventListener('change', function () {
          var picked = file.files && file.files[0];
          if (!picked) return;
          var form = new FormData();
          form.append('file', picked);
          upload.disabled = true;
          upload.querySelector('span').textContent = '上傳中…';
          fetch('/api/admin/upload', { method: 'POST', body: form })
            .then(function (res) { return res.json(); })
            .then(function (data) {
              if (data.error) throw new Error(data.error);
              text.value = data.url;
              onInput(data.url);
              paint(data.url);
              toast('圖片已上傳：' + data.name, 'ok');
            })
            .catch(function (err) { toast('上傳失敗：' + err.message, 'err'); })
            .finally(function () {
              upload.disabled = false;
              upload.querySelector('span').textContent = '上傳圖片';
              file.value = '';
            });
        });

        var holder = el('div', { class: 'imgfield' }, [
          value ? preview : wrap,
          el('div', { class: 'imgbody' }, [
            text,
            el('div', { class: 'row' }, [upload, file]),
            el('div', { class: 'hint', text: spec.hint || '可以直接上傳，或填現有的圖檔名稱' })
          ])
        ]);
        if (value) preview.src = imageSrc(value);

        return el('div', { class: 'field' }, [
          el('label', { text: spec.label }),
          holder
        ]);
      }

        function draftValue(field, lang) {
          if (lang === baseLang()) {
            return Object.prototype.hasOwnProperty.call(editing.draft, field)
              ? editing.draft[field]
              : valueOf(entity, row, field, lang);
          }
          var bag = editing.tr[lang] || {};
          return Object.prototype.hasOwnProperty.call(bag, field) ? bag[field] : valueOf(entity, row, field, lang);
        }

        function setDraft(field, lang, value) {
          if (lang === baseLang()) editing.draft[field] = value;
          else {
            editing.tr[lang] = editing.tr[lang] || {};

        spec.langFields.forEach(function (f) {

          if (missing.length) { toast('「' + missing[0].label + '」不能空白', 'err'); return; }

          saveBtn.disabled = true;

          }).then(function (res) {
            editing = null;

            /* 新增產品後自動產生別名候選：新產品沒有別名，客戶只能打

      /* ---------- 客戶詢價 ---------- */

      /* created_at 是 D1 的 CURRENT_TIMESTAMP，存的是 UTC。
         直接顯示會少八小時，所以這裡轉成台灣時間再顯示。 */
      function localTime(utc) {
        if (!utc) return '';
        var iso = String(utc).replace(' ', 'T');
        if (!/[zZ]|[+-]\d\d:?\d\d$/.test(iso)) iso += 'Z';
        var d = new Date(iso);
        if (isNaN(d.getTime())) return String(utc);
        function p(n) { return (n < 10 ? '0' : '') + n; }
        return d.getFullYear() + '/' + p(d.getMonth() + 1) + '/' + p(d.getDate()) +
               ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
      }

         （mode = 卡片／表格，q = 搜尋字串，showDone = 含已處理） */
      function inquiryMatch(q, term) {
        if (!term) return true;
        var hay = [q.company, q.email, q.phone, q.product, q.message, q.note]
          .join(' ').toLowerCase();
        return term.toLowerCase().split(/\s+/).every(function (w) {
          return !w || hay.indexOf(w) > -1;
        });
      }

              (function () {
                var cb = el('input', { type: 'checkbox' });
                cb.checked = !!inquiryView.showDone;
                cb.addEventListener('change', function () {
                  inquiryView.showDone = this.checked;
                  paintList();
                });
                return cb;
              })(),
              el('span', { text: '含已處理' })
            ]),
            el('span', { class: 'spacer', style: 'margin-left:auto' }),
            countLabel
          ])
        ]));

        main.appendChild(listBox);

        function save(q, note, status) {
          api('/api/admin/save', {
            entity: 'inquiry', action: 'update', id: q.id,
            base: { status: status == null ? q.status : status, note: note }
          }).then(function () {
            toast(status === 'done' ? '已標記處理完成' : '已儲存', 'ok');
            return reload();
          }).catch(function (err) { toast('失敗：' + err.message, 'err'); });
        }

        function remove(q) {
          confirmDialog('確定要刪除這筆詢價？', '（' + (q.company || q.email) + '）刪除後無法復原。', function () {
            api('/api/admin/save', { entity: 'inquiry', action: 'delete', id: q.id })
              .then(function () { toast('已刪除', 'ok'); return reload(); })
              .catch(function (err) { toast('刪除失敗：' + err.message, 'err'); });
          });
        }

        function cardOf(q) {
          var done = q.status === 'done';
          var note = el('input', { type: 'text', value: q.note || '', placeholder: '誰跟進、結果如何' });

          var mailLink = q.email ? el('a', { href: 'mailto:' + q.email, text: q.email, style: 'font-weight:700;' }) : null;
          var telLink = q.phone ? el('a', { href: 'tel:' + String(q.phone).replace(/[^\d+,]/g, ''), text: q.phone, style: 'font-weight:700;' }) : null;

          return el('div', { class: 'card', style: done ? 'opacity:.62' : '' }, [
            el('div', { class: 'sect-label', style: 'display:flex;gap:10px;align-items:center;flex-wrap:wrap' }, [
              el('span', { text: localTime(q.created_at) }),
              done ? el('span', { class: 'chip plain', style: 'border-color:#bfe0cd;background:#f0f9f4;color:#0f7a4e', text: '已處理' }) : null,
              q.mailed ? null : el('span', { class: 'chip plain', style: 'border-color:#f0d3a8;background:#fff8ef;color:#8a5a12', text: '通知信未寄出' })
            ]),
            el('div', { class: 'field' }, [
              detailRow('公司名稱', q.company, { strong: true }),
              detailRow('商務信箱', mailLink || ''),
              detailRow('聯絡電話', telLink || ''),
              detailRow('詢問產品', q.product),
              detailRow('需求內容', q.message, { pre: true }),
              detailRow('送出頁面', (q.page || '') + (q.lang ? '　語言：' + q.lang : ''))
            ]),
            el('div', { class: 'field' }, [el('label', { text: '內部備註' }), note]),
            el('div', { class: 'formfoot' }, [
              done
                ? el('button', { class: 'btn ghost', onclick: function () { save(q, note.value, 'new'); } }, [el('span', { text: '改回未處理' })])
                : el('button', { class: 'btn', onclick: function () { save(q, note.value, 'done'); } },
                    [el('i', { class: 'fa-solid fa-check' }), el('span', { text: '標記處理完成' })]),
              el('button', { class: 'btn ghost', onclick: function () { save(q, note.value, null); } }, [el('span', { text: '只存備註' })]),
              el('span', { class: 'spacer' }),
              el('button', { class: 'btn danger', onclick: function () { remove(q); } },
                [el('i', { class: 'fa-solid fa-trash' }), el('span', { text: '刪除' })])
            ])
          ]);
        }

        /* 表格模式：一列一筆，點「展開」才看得到完整需求內容。
           適合快速掃過一整批，卡片模式適合逐筆處理。 */
        function tableOf(list) {
          var body = [];

          list.forEach(function (q) {
            var done = q.status === 'done';
            var open = false;
            var detail = el('tr', { style: 'display:none' }, [
              el('td', { colspan: '6', style: 'background:#f8fafc' }, [
                (function () {
                  var note = el('input', { type: 'text', value: q.note || '', placeholder: '內部備註：誰跟進、結果如何' });
                  return el('div', {}, [
                    detailRow('需求內容', q.message, { pre: true }),
                    detailRow('送出頁面', (q.page || '') + (q.lang ? '　語言：' + q.lang : '')),
                    el('div', { style: 'display:flex; gap:10px; align-items:center; margin-top:12px; flex-wrap:wrap;' }, [
                      note,
                      el('button', { class: 'btn sm', onclick: function () { save(q, note.value, null); } }, [el('span', { text: '存備註' })]),
                      el('button', { class: 'btn danger sm', onclick: function () { remove(q); } }, [el('span', { text: '刪除' })])
                    ])
                  ]);
                })()
              ])
            ]);

            var toggle = el('button', {
              class: 'btn ghost sm',
              onclick: function () {
                open = !open;
                detail.style.display = open ? '' : 'none';
                this.querySelector('span').textContent = open ? '收合' : '展開';
              }
            }, [el('span', { text: '展開' })]);

            body.push(el('tr', { style: done ? 'opacity:.55' : '' }, [
              el('td', {}, [el('div', { class: 'rowsub', style: 'white-space:nowrap', text: localTime(q.created_at) })]),
              el('td', {}, [
                el('div', { class: 'rowtitle', text: q.company || '（未填公司）' }),
                el('div', { class: 'rowsub' }, [
                  q.email ? el('a', { href: 'mailto:' + q.email, text: q.email }) : el('span', { text: '—' })
                ])
              ]),
              el('td', { style: 'white-space:nowrap' }, [el('div', { class: 'rowsub', text: q.phone || '—' })]),
              el('td', { style: 'white-space:nowrap' }, [el('div', { class: 'rowsub', text: q.product || '—' })]),
              el('td', {}, [
                el('div', {
                  class: 'rowsub',
                  style: 'max-width:320px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;',
                  text: q.message || '—'
                })
              ]),
              el('td', { class: 'right' }, [
                el('div', { style: 'display:flex; gap:8px; justify-content:flex-end; align-items:center;' }, [
                  q.mailed ? null : el('span', { title: '通知信未寄出', style: 'color:#b45309' }, [el('i', { class: 'fa-solid fa-triangle-exclamation' })]),
                  done
                    ? el('button', { class: 'btn ghost sm', onclick: function () { save(q, q.note || '', 'new'); } }, [el('span', { text: '改回未處理' })])
                    : el('button', { class: 'btn sm', onclick: function () { save(q, q.note || '', 'done'); } }, [el('i', { class: 'fa-solid fa-check' })]),
                  toggle
                ])
              ])
            ]));
            body.push(detail);
          });

          /* 欄位不換行 + 最小寬度：窄畫面改成橫向捲動，
             不要把「詢問產品」壓成一個字一行 */
          return el('div', { class: 'card', style: 'overflow-x:auto' }, [
            el('table', { style: 'min-width:940px' }, [
              el('thead', {}, [el('tr', {}, [
                el('th', { style: 'white-space:nowrap', text: '時間' }),
                el('th', { style: 'white-space:nowrap', text: '公司／信箱' }),
                el('th', { style: 'white-space:nowrap', text: '電話' }),
                el('th', { style: 'white-space:nowrap', text: '詢問產品' }),
                el('th', { text: '需求內容' }),
                el('th', { class: 'right', text: '' })
              ])]),
              el('tbody', {}, body)
            ])
          ]);
        }

        function paintList() {
          var term = String(inquiryView.q || '').trim();
          var list = rows.filter(function (q) {
            if (!inquiryView.showDone && q.status === 'done') return false;
            return inquiryMatch(q, term);
          });

          countLabel.textContent = term || inquiryView.showDone
            ? '符合 ' + list.length + ' 筆（共 ' + rows.length + ' 筆）'
            : '未處理 ' + list.length + ' 筆（共 ' + rows.length + ' 筆）';

          listBox.innerHTML = '';

          if (!list.length) {
            listBox.appendChild(el('div', { class: 'card' }, [
              el('div', { class: 'empty' }, [
                el('i', { class: 'fa-regular fa-envelope' }),
                el('div', { text: term ? '找不到符合「' + term + '」的詢價。' : (inquiryView.showDone ? '還沒有任何詢價紀錄。' : '沒有未處理的詢價。') })
              ])
            ]));
            return;
          }

          if (inquiryView.mode === 'table') {
            listBox.appendChild(tableOf(list));
          } else {
            list.forEach(function (q) { listBox.appendChild(cardOf(q)); });
          }
        }

        paintList();
      }

      /* ---------- 公司資訊 ---------- */
      function settingView() {
        var main = document.getElementById('main');
        var rows = DB.settings || [];
        var langs = DB.languages || [];
        if (!activeLang || !langs.some(function (l) { return l.code === activeLang; })) activeLang = baseLang();

        main.appendChild(el('div', { class: 'head' }, [
          el('div', {}, [
            el('h1', { text: '公司資訊' }),
            el('p', { text: '全站的頁尾與聯繫我們都讀這裡。詢價通知信也會寄到下面的聯絡信箱。' })
          ])
        ]));

        var drafts = {};

        var card = el('div', { class: 'card' });
        var tabs = el('div', { class: 'tabs' });
        langs.forEach(function (l) {
          tabs.appendChild(el('button', {
            class: activeLang === l.code ? 'on' : '',
            onclick: function () { activeLang = l.code; render(); }
          }, [el('span', { text: l.label })]));
        });
        card.appendChild(tabs);

        rows.forEach(function (s) {
          var translatable = !!s.translatable;
          if (activeLang !== baseLang() && !translatable) return;

          var current = activeLang === baseLang()
            ? s.value
            : (function () {
                var hit = (DB.translations || []).filter(function (t) {
                  return t.entity === 'setting' && String(t.entity_id) === String(s.id) && t.field === 'value' && t.lang === activeLang;
                })[0];
                return hit ? hit.value : '';
              })();

          card.appendChild(fieldNode(
            { key: s.key, label: s.label || s.key, type: 'text', hint: s.hint },
            current,
            function (v) { drafts[s.id] = v; }
          ));
        });

        if (activeLang !== baseLang()) {
          card.appendChild(el('div', { class: 'field' }, [
            el('div', { class: 'hint', text: '電話與信箱不分語言，只在繁體中文頁籤編輯。' })
          ]));
        }

        var save = el('button', { class: 'btn' }, [el('i', { class: 'fa-solid fa-check' }), el('span', { text: '儲存' })]);
        save.addEventListener('click', function () {
          var ids = Object.keys(drafts);
          if (!ids.length) { toast('沒有變更'); return; }
          save.disabled = true;
          Promise.all(ids.map(function (id) {
            var payload = { entity: 'setting', action: 'update', id: Number(id) };
            if (activeLang === baseLang()) payload.base = { value: drafts[id] };
            else { payload.base = {}; payload.tr = {}; payload.tr[activeLang] = { value: drafts[id] }; }
            return api('/api/admin/save', payload);
          })).then(function () {
            toast('已儲存', 'ok');
            return reload();
          }).catch(function (err) {
            toast('存檔失敗：' + err.message, 'err');
            save.disabled = false;
          });
        });

        card.appendChild(el('div', { class: 'formfoot' }, [save]));
        main.appendChild(card);
      }

      /* ---------- 語言 ---------- */
      function languageView() {
        var main = document.getElementById('main');
        var langs = DB.languages || [];

        main.appendChild(el('div', { class: 'head' }, [
          el('div', {}, [
            el('h1', { text: '語言' }),
            el('p', { text: '新增一種語言後，產品與時間軸的編輯畫面就會多一個頁籤，把內容填進去即可。' })
          ])
        ]));

        var body = langs.map(function (l) {
          return el('tr', {}, [
            el('td', {}, [el('div', { class: 'rowtitle', text: l.label }), el('div', { class: 'rowsub', text: l.code })]),
            el('td', {}, [el('span', { class: 'chip plain', text: l.is_base ? '基準語言' : '翻譯' })]),
            el('td', { class: 'right' }, [
              l.is_base ? el('span', { class: 'rowsub', text: '不可刪除' }) : el('button', {
                class: 'btn danger sm',
                onclick: function () {
                  confirmDialog('確定要刪除語言？', '「' + l.label + '」以及這個語言的所有翻譯內容都會被刪除，無法復原。', function () {
                    api('/api/admin/save', { entity: 'language', action: 'delete', id: l.code })
                      .then(function () { toast('已刪除', 'ok'); return reload(); })
                      .catch(function (err) { toast('刪除失敗：' + err.message, 'err'); });
                  });
                }
              }, [el('span', { text: '刪除' })])
            ])
          ]);
        });

        main.appendChild(el('div', { class: 'card' }, [
          el('table', {}, [
            el('thead', {}, [el('tr', {}, [el('th', { text: '語言' }), el('th', { text: '類型' }), el('th', { class: 'right', text: '' })])]),
            el('tbody', {}, body)
          ])
        ]));

        var code = el('input', { type: 'text', placeholder: 'ja' });
        var label = el('input', { type: 'text', placeholder: '日本語' });

        main.appendChild(el('div', { class: 'card' }, [
          el('div', { class: 'sect-label', text: '新增語言' }),
          el('div', { class: 'grid2' }, [
            el('div', { class: 'field' }, [
              el('label', { text: '語言代碼' }), code,
              el('div', { class: 'hint', text: '用標準代碼：ja（日文）、vi（越南文）、ko（韓文）' })
            ]),
            el('div', { class: 'field' }, [
              el('label', { text: '顯示名稱' }), label,
              el('div', { class: 'hint', text: '編輯頁的頁籤會顯示這個名稱' })
            ])
          ]),
          el('div', { class: 'formfoot' }, [
            el('button', {
              class: 'btn',
              onclick: function () {
                var c = code.value.trim();
                if (!c) { toast('語言代碼不能空白', 'err'); return; }
                api('/api/admin/save', {
                  entity: 'language', action: 'create',
                  base: { code: c, label: label.value.trim() || c, sort_order: langs.length }
                }).then(function () {
                  toast('已新增語言', 'ok');
                  return reload();
                }).catch(function (err) { toast('新增失敗：' + err.message, 'err'); });
              }
            }, [el('i', { class: 'fa-solid fa-plus' }), el('span', { text: '新增' })])
          ])
        ]));
      }

      /* ---------- 主繪製 ---------- */
      function render() {
        renderNav();
        var main = document.getElementById('main');
        main.innerHTML = '';

        /* 密碼登入時才顯示登出（Access 的登出是 Cloudflare 那邊管的） */
        var box = document.getElementById('logoutBox');
        box.innerHTML = '';
        if (DB.access && DB.access.mode === 'password') {
          box.appendChild(el('a', {
            href: '#',
            onclick: function (e) {
              e.preventDefault();
              api('/api/admin/logout', {}).then(function () { DB = { access: {} }; loginView('已登出'); });
            }
          }, [el('i', { class: 'fa-solid fa-right-from-bracket' }), el('span', { text: ' 登出' })]));
        }

        if (DB.access && !DB.access.protected) {
          main.appendChild(el('div', { class: 'banner bad' }, [
            el('i', { class: 'fa-solid fa-triangle-exclamation' }),
            el('div', {}, [
              el('b', { text: '這個頁面目前沒有登入保護' }),
              el('span', { text: '任何知道網址的人都能修改或刪除網站內容。請在 Cloudflare 設定 Access，保護 /admin* 與 /api/admin* 兩個路徑（做法見 README-admin.txt）。' })
            ])
          ]));
        }

        if (editing) { formView(); return; }
        if (view === 'product' || view === 'timeline') { listView(view); return; }
        if (view === 'synonym') { synonymView(); return; }
        if (view === 'suggestion') { suggestionView(); return; }
        if (view === 'inquiry') { inquiryView(); return; }
        if (view === 'setting') { settingView(); return; }
        if (view === 'language') { languageView(); return; }
      }

      reload();
    })();
  </script>
</body>

</html>
