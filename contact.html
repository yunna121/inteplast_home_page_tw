  <script>
    function switchContactMode(mode) {
      const tabForm = document.getElementById('tabLeaveInfo');
      const tabDirect = document.getElementById('tabDirectContact');
      const panelForm = document.getElementById('panelFormMode');
      const panelDirect = document.getElementById('panelDirectMode');

      if (mode === 'form') {
        tabForm.classList.add('active');
        tabDirect.classList.remove('active');
        panelForm.classList.add('active');
        panelDirect.classList.remove('active');
      } else {
        tabDirect.classList.add('active');
        tabForm.classList.remove('active');
        panelDirect.classList.add('active');
        panelForm.classList.remove('active');
      }
    }

    /* 產品類別選單跟著 D1 的產品資料走 —— 後台新增或改名，這裡自動同步，
       不必再動檔案。送出的 value 一律是繁中品名，業務在後台看到的才一致；
       顯示文字交給 site-lang.js 依語言替換（data-tw 是它的索引鍵）。
       載入失敗就留「請選擇產品」，客戶仍可在訊息欄自行說明。 */
    fetch('/api/products')
      .then(function (res) { return res.json(); })
      .then(function (rows) {
        if (!Array.isArray(rows) || !rows.length) return;
        var sel = document.getElementById('productCategory');
        rows.forEach(function (p) {
          if (!p.name) return;
          var opt = document.createElement('option');
          opt.value = p.name;
          opt.setAttribute('data-tw', p.name);
          opt.setAttribute('data-en', '');
          opt.textContent = p.name;
          sel.appendChild(opt);
        });
        // 選項是後插的，要再套一次目前語言才會翻譯
        if (window.applyLanguage) window.applyLanguage();
      })
      .catch(function () { /* 靜默失敗：選單維持佔位選項 */ });

    /* 表單送出 → POST /api/inquiry → 寫進 D1 的 inquiries 表。
       不寄信：業務到後台的「客戶詢價」看紀錄並主動聯繫。
       送出失敗時給出信箱與電話，客戶還有路可走。 */
    const FALLBACK_MAILTO = 'lyanchen@wpjk.INTEPLAST.com';

    document.getElementById('contactForm').addEventListener('submit', function (e) {
      e.preventDefault();

      const form = e.currentTarget;
      const submitBtn = document.getElementById('submitBtn');
      const statusDiv = document.getElementById('statusMessage');

      /* 蜜罐：機器人填了 website 就當作已送出，不真的送
         （後端也有同一道防線，兩邊都擋） */
      if (form.website && form.website.value) {
        statusDiv.style.color = '#10B981';
        statusDiv.innerHTML = '<i class="fa-solid fa-circle-check"></i> 已成功送出！我們的團隊將會安排專人與您聯繫。';
        form.reset();
        return;
      }

      submitBtn.disabled = true;
      statusDiv.style.color = 'var(--brand-blue)';
      statusDiv.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 資料傳送中，請稍候...';

      const payload = new FormData(form);
      payload.set('lang', document.documentElement.lang || '');
      payload.set('page', location.pathname + location.hash);

      fetch('/api/inquiry', { method: 'POST', body: payload })
        .then(function (res) {
          return res.json().then(function (data) { return { res: res, data: data }; });
        })
        .then(function (out) {
          if (!out.res.ok || out.data.error) throw new Error(out.data.error || ('HTTP ' + out.res.status));
          statusDiv.style.color = '#10B981';
          statusDiv.innerHTML = '<i class="fa-solid fa-circle-check"></i> 已成功送出！我們的團隊將會安排專人與您聯繫。';
          form.reset();
          submitBtn.disabled = false;
        })
        .catch(function (err) {
          statusDiv.style.color = '#DC2626';
          statusDiv.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i> 送出失敗（' +
            (err.message || '連線異常') + '），請改寄 <a href="mailto:' + FALLBACK_MAILTO +
            '" style="color:#DC2626; font-weight:800;">' + FALLBACK_MAILTO +
            '</a> 或電洽 02-2712-2211 #8109。';
          submitBtn.disabled = false;
        });
    });

          document.addEventListener("click", function (e) {
        if (!e.target.closest(".nav-item")) {
          document.querySelectorAll(".nav-item.open-dropdown").forEach(i => i.classList.remove("open-dropdown"));
        }
      });

      /* 舊版的詢價籃會用 ?specs= 把勾選的規格帶進來自動填訊息；
         規格頁與詢價籃都已移除，這段沒有來源、留著只會誤導，故刪除。 */
