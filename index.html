<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scroll-linked Animation Template</title>
  
  <!-- 引入 GSAP 與 ScrollTrigger -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
  
  <style>
    /* =========================================
       1. 基本重置與全域設定
       ========================================= */
    body, html {
      margin: 0;
      padding: 0;
      font-family: "Helvetica Neue", Arial, sans-serif;
      overflow-x: hidden;
    }

    /* =========================================
       2. 導覽列 (Header) 樣式
       ========================================= */
    .header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-sizing: border-box;
      z-index: 100;
      pointer-events: none; /* 讓 Header 背景不阻擋點擊 */
    }
    
    .header * {
      pointer-events: auto; /* 讓按鈕可以被點擊 */
    }

    /* 1. 外層容器：保持水平排列 */
    .header-logo {
      display: flex;
      align-items: center;   /* 垂直置中對齊 */
      gap: 15px;             /* Logo 與文字之間的距離 */
      opacity: 0;            /* 初始隱藏，往下捲動後淡入 */
      color: #333333;        /* 初始文字顏色 */
    }

    /* 2. Logo 圖片：設定固定寬度 */
    .logo-image {
      width: 80px;          /* 🌟 在這裡設定 Logo 的寬度 */
      height: auto;
      object-fit: contain;
    }

    /* 3. 文字容器：與 Logo 等寬，並垂直排列 */
    .logo-text-wrapper {
      width: 220px;          /* 🌟 在這裡設定文字區塊的寬度 (請與上方 Logo 寬度保持一致) */
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    /* 4. 中文樣式 (大字) */
    .logo-text-tw {
      font-size: 18px;       
      font-weight: bold;
      letter-spacing: 1px;   /* 字元間距 */
      line-height: 1.2;
    }

    /* 5. 英文樣式 (小字) */
    .logo-text-en {
      font-size: 10px;       
      font-weight: normal;
      letter-spacing: 0.5px;
      line-height: 1.2;
      opacity: 0.8;          /* 讓英文稍微淡一點，增加視覺層次 */
      margin-top: 4px;       /* 中英文之間的上下距離 */
    }

    /* =========================================
       更新的導覽列按鈕樣式
       ========================================= */
       
    /* 1. 中間置中區塊：使用絕對定位確保完美置中 */
    .header-center {
      position: absolute;
      left: 50%;
      transform: translateX(-50%); /* 將區塊往左拉回自身寬度的一半，達成完美置中 */
      background: white;
      border-radius: 40px;         /* 膠囊狀圓角 */
      padding: 5px 10px;           /* 內邊距 */
      box-shadow: 0 4px 10px rgba(0,0,0,0.05); /* 淡淡的陰影 */
      pointer-events: auto;        /* 確保可以點擊 */
      display: flex;
    }

    /* 中間區塊內的按鈕 (去除按鈕本身的背景，因為父層已經是白色了) */
    .header-center button {
      background: transparent;
      border: none;
      padding: 10px 20px;
      cursor: pointer;
      font-weight: bold;
      color: #333333;
      font-size: 15px;
    }

    /* 2. 右側按鈕區塊 */
    .header-right {
      pointer-events: auto; /* 確保可以點擊 */
    }

    /* 右側獨立按鈕 (自帶白色背景) */
    .header-right button {
      background: white;
      border: none;
      padding: 15px 30px;
      border-radius: 40px;
      cursor: pointer;
      font-weight: bold;
      color: #333333;
      font-size: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }

    /* =========================================
       3. 核心動畫區塊 (Hero Section) 樣式
       ========================================= */
    .hero-section {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    /* 左側純色背景 */
    .bg-left {
      position: absolute;
      top: 0;
      left: 0;
      width: 50%;
      height: 100%;
      background-color: #f6f5f7; /* 原圖左側的淡灰粉色 */
      z-index: 1;
    }

    /* 右側圖片背景 */
    .bg-right {
      position: absolute;
      top: 0;
      right: 0;
      width: 50%; /* 初始佔一半 */
      height: 100%;
      /* 使用網址替換為您的實際背景圖 */
      background: url('.\\src\\Foodservice-HERO-1.jpg') center/cover no-repeat; 
      z-index: 2;
    }

    /* 內容區塊 (文字與產品圖) */
    .content-box {
      position: absolute;
      top: 0;
      left: 0;
      width: 50%; /* 初始寬度佔一半，確保內容在左邊置中 */
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10;
      color: #333333; /* 初始深色文字 */
      text-align: center;
    }

    .title {
      font-size: 3rem;
      font-weight: normal;
      margin-bottom: 20px;
      line-height: 1.2;
    }

    .product-img-placeholder {
      width: 200px;
      height: 250px;
      background: #ffffff;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 20px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }

    /* =========================================
       4. 測試用的下方假內容區塊
       ========================================= */
    .dummy-content {
      height: 150vh;
      background: #222;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
    }
    /* 控制產品圖片的大小，讓它乖乖待在框框裡 */
    .product-image {
      width: 100%;
      height: 100%;
      object-fit: cover;   /* 讓圖片完美填滿框框 (如果不想被裁切，可以改成 contain) */
      border-radius: 10px; /* 配合外框的圓角設定 */
    }
  </style>
</head>
<body>
  <header class="header">
    <!-- 浮動導覽列 -->
    <div class="header-logo">
      <!-- 替換為您的 Logo 檔案路徑 -->
      <img src="./src/inteplast-logo-blue.svg" alt="Inteplast Logo" class="logo-image">
      
      <!-- 新增文字容器，將中英文分兩行 -->
      <div class="logo-text-wrapper">
        <span class="logo-text-tw">臺灣營德股份有限公司</span>
        <span class="logo-text-en">INTEPLAST TAIWAN CORPORATION</span>
      </div>
    </div>
    
    <!-- 🌟【新增】中間置中的按鈕區塊 (白色膠囊底色) -->
    <div class="header-center">
      <button>關於</button>
      <button>商品</button>
    </div>

    <!-- 🌟【新增】右側的獨立按鈕區塊 -->
    <div class="header-right">
      <button>聯繫我們</button>
    </div>
  </header>

  <!-- 捲動動畫區塊 -->
  <section class="hero-section">
    <div class="bg-left"></div>
    <div class="bg-right"></div>
    
    <div class="content-box">
      <h1 class="title">the smallest part of EVERY DAY</h1>
      <div class="product-img-placeholder">
        <img src="./src/Can-Liners-HERO-1.jpg" alt="Product Image" class="product-image">
      </div>
      <p></p>
    </div>
  </section>

  <!-- 下方區塊，讓網頁有空間可以繼續往下捲動 -->
  <section class="dummy-content">
    網頁其他內容...
  </section>

  <!-- =========================================
       GSAP 動畫邏輯
       ========================================= -->
  <script>
    // 註冊 ScrollTrigger 插件
    gsap.registerPlugin(ScrollTrigger);

    // 建立一個時間軸 (Timeline)
    const tl = gsap.timeline({
      scrollTrigger: {
        trigger: ".hero-section",
        start: "top top", // 當 hero-section 頂部碰到視窗頂部時開始
        end: "+=150%",    // 往下捲動 150% 視窗高度的距離來完成動畫 (數值越大，動畫越慢)
        scrub: 1,         // 開啟 scrub 讓動畫平滑跟隨滑鼠捲動進度
        pin: true,        // 將 hero-section 固定在畫面上，直到動畫結束
      }
    });

    // 加入動畫指令，第三個參數 "0" 代表這些動畫同時開始
    
    // 1. 背景圖擴展到 100% 寬度
    tl.to(".bg-right", { width: "100%", duration: 1 }, 0);
    
    // 2. 內容區塊擴展到 100% 寬度 (這會讓內部透過 Flexbox 置中的元素自然移動到全螢幕的正中央)
    tl.to(".content-box", { width: "100%", duration: 1 }, 0);
    
    // 3. 文字顏色從深灰過渡到白色
    tl.to(".content-box", { color: "#ffffff", duration: 1 }, 0);
    
    // 4. 左上角的 Logo 淡出顯示 (模擬原網站的效果)
    tl.to(".header-logo", { opacity: 1, duration: 0.5 }, 0.5); 
  </script>

</body>
</html>
