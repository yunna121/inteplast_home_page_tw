<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scroll-linked Animation Template</title>
  
  <!-- 引入 GSAP 與 ScrollTrigger -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
  
  <style>
    /* =========================================
       1. 基本重置與全域設定
       ========================================= */
    body, html {
      margin: 0;
      padding: 0;
      font-family: "Helvetica Neue", Arial, sans-serif;
      overflow-x: hidden;
    }

    /* =========================================
       2. 導覽列 (Header) 樣式
       ========================================= */
    .header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-sizing: border-box;
      z-index: 100;
      pointer-events: none; /* 讓 Header 背景不阻擋點擊 */
    }
    
    .header * {
      pointer-events: auto; /* 讓按鈕可以被點擊 */
    }

    .header-logo {
      font-weight: bold;
      font-size: 20px;
      opacity: 0; /* 初始隱藏，捲動後顯示 */
    }

    .header-nav button {
      background: white;
      border: none;
      padding: 10px 20px;
      margin-left: 10px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    /* =========================================
       3. 核心動畫區塊 (Hero Section) 樣式
       ========================================= */
    .hero-section {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    /* 左側純色背景 */
    .bg-left {
      position: absolute;
      top: 0;
      left: 0;
      width: 50%;
      height: 100%;
      background-color: #f6f5f7; /* 原圖左側的淡灰粉色 */
      z-index: 1;
    }

    /* 右側圖片背景 */
    .bg-right {
      position: absolute;
      top: 0;
      right: 0;
      width: 50%; /* 初始佔一半 */
      height: 100%;
      /* 使用網址替換為您的實際背景圖 */
      background: url('https://images.unsplash.com/photo-1616046229478-9901c5536a45?q=80&w=2000&auto=format&fit=crop') center/cover no-repeat; 
      z-index: 2;
    }

    /* 內容區塊 (文字與產品圖) */
    .content-box {
      position: absolute;
      top: 0;
      left: 0;
      width: 50%; /* 初始寬度佔一半，確保內容在左邊置中 */
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10;
      color: #333333; /* 初始深色文字 */
      text-align: center;
    }

    .title {
      font-size: 3rem;
      font-weight: normal;
      margin-bottom: 20px;
      line-height: 1.2;
    }

    .product-img-placeholder {
      width: 200px;
      height: 250px;
      background: #ffffff;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 20px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }

    /* =========================================
       4. 測試用的下方假內容區塊
       ========================================= */
    .dummy-content {
      height: 150vh;
      background: #222;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
    }
  </style>
</head>
<body>

  <!-- 浮動導覽列 -->
  <header class="header">
    <div class="header-logo">EQUELLE</div>
    <div class="header-nav">
      <button>關於</button>
      <button>特徵</button>
      <button>在此購買</button>
    </div>
  </header>

  <!-- 捲動動畫區塊 -->
  <section class="hero-section">
    <div class="bg-left"></div>
    <div class="bg-right"></div>
    
    <div class="content-box">
      <h1 class="title">trusted by<br><b>SCIENCE</b><br>made for<br><b>EVERY WOMAN</b></h1>
      <div class="product-img-placeholder">
        產品圖片
      </div>
      <p>一款由精心挑選的優質原料製成的<br>女性必備營養補充品。</p>
    </div>
  </section>

  <!-- 下方區塊，讓網頁有空間可以繼續往下捲動 -->
  <section class="dummy-content">
    網頁其他內容...
  </section>

  <!-- =========================================
       GSAP 動畫邏輯
       ========================================= -->
  <script>
    // 註冊 ScrollTrigger 插件
    gsap.registerPlugin(ScrollTrigger);

    // 建立一個時間軸 (Timeline)
    const tl = gsap.timeline({
      scrollTrigger: {
        trigger: ".hero-section",
        start: "top top", // 當 hero-section 頂部碰到視窗頂部時開始
        end: "+=150%",    // 往下捲動 150% 視窗高度的距離來完成動畫 (數值越大，動畫越慢)
        scrub: 1,         // 開啟 scrub 讓動畫平滑跟隨滑鼠捲動進度
        pin: true,        // 將 hero-section 固定在畫面上，直到動畫結束
      }
    });

    // 加入動畫指令，第三個參數 "0" 代表這些動畫同時開始
    
    // 1. 背景圖擴展到 100% 寬度
    tl.to(".bg-right", { width: "100%", duration: 1 }, 0);
    
    // 2. 內容區塊擴展到 100% 寬度 (這會讓內部透過 Flexbox 置中的元素自然移動到全螢幕的正中央)
    tl.to(".content-box", { width: "100%", duration: 1 }, 0);
    
    // 3. 文字顏色從深灰過渡到白色
    tl.to(".content-box", { color: "#ffffff", duration: 1 }, 0);
    
    // 4. 左上角的 Logo 淡出顯示 (模擬原網站的效果)
    tl.to(".header-logo", { opacity: 1, duration: 0.5 }, 0.5); 
  </script>

</body>
</html>
