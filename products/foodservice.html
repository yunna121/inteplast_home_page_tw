<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>頁面已依產品大類拆分 | 台灣營德 Inteplast Taiwan</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', 'Noto Sans TC', sans-serif; background: #F8FAFC; color: #1E293B; min-height: 100vh; display: grid; place-items: center; padding: 40px; }
    .wrap { max-width: 760px; width: 100%; background: #FFFFFF; border: 1px solid #CBD5E1; border-radius: 20px; box-shadow: 0 10px 25px -5px rgba(10,37,64,0.08); padding: 48px; }
    h1 { font-size: 1.6rem; font-weight: 900; color: #0A2540; margin-bottom: 12px; }
    p { font-size: 0.98rem; color: #64748B; line-height: 1.7; margin-bottom: 28px; }
    ul { list-style: none; display: flex; flex-direction: column; gap: 14px; }
    a.card { display: flex; align-items: center; justify-content: space-between; gap: 20px; text-decoration: none; background: #F8FAFC; border: 1px solid #CBD5E1; border-radius: 14px; padding: 20px 24px; transition: all 0.2s ease; }
    a.card:hover { border-color: #00529B; background: #EFF6FF; transform: translateY(-2px); }
    a.card > span:first-child { display: flex; flex-direction: column; }
    .name { font-size: 1.05rem; font-weight: 800; color: #0A2540; }
    .sub { font-size: 0.86rem; font-weight: 500; color: #64748B; margin-top: 4px; }
    .go { font-size: 0.9rem; font-weight: 800; color: #00529B; white-space: nowrap; }
    .home { display: inline-block; margin-top: 28px; font-size: 0.9rem; font-weight: 700; color: #00529B; text-decoration: none; }
    .home:hover { color: #00A8FF; }
  </style>
  <link rel="stylesheet" href="../src/responsive.css">
</head>
<body>
  <div class="wrap">
    <h1>本頁已依產品大類拆分</h1>
    <p>原本的耐熱袋與食品包裝頁已分成三個獨立分類頁，請選擇要前往的產品線。</p>
    <ul>
      <li>
        <a class="card" href="heat-bags.html">
          <span>
            <span class="name">耐熱袋</span>
            <span class="sub">平裝耐熱袋 · 卷裝耐熱袋</span>
          </span>
          <span class="go">前往 →</span>
        </a>
      </li>
      <li>
        <a class="card" href="sealed-packaging.html">
          <span>
            <span class="name">夾鏈袋</span>
            <span class="sub">夾鏈袋 · 密實袋 · 立體密實袋 · 冷凍袋</span>
          </span>
          <span class="go">前往 →</span>
        </a>
      </li>
      <li>
        <a class="card" href="accessories.html">
          <span>
            <span class="name">其他類</span>
            <span class="sub">手套 · 台塑遮蔽防塵膠帶</span>
          </span>
          <span class="go">前往 →</span>
        </a>
      </li>
    </ul>
    <a class="home" href="index.html">← 回產品中心</a>
  </div>
  <script src="../src/mobile-nav.js"></script>
</body>
</html>
