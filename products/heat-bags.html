<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>蔬果袋 | 台灣營德 Inteplast Taiwan</title>
  <meta name="description" content="台灣營德蔬果袋：平裝耐熱袋、卷裝耐熱袋與蔬果袋，四兩~15斤等比例尺寸對照與批量詢價。">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --primary-navy: #0A2540;
      --brand-blue: #00529B;
      --brand-blue-hover: #003d75;
      --accent-azure: #00A8FF;
      --bg-light: #F8FAFC;
      --surface-white: #FFFFFF;
      --text-main: #1E293B;
      --text-muted: #64748B;
      --border-color: #E2E8F0;
      --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      --shadow-md: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
      --shadow-lg: 0 20px 40px -15px rgba(10, 37, 64, 0.15);
      --radius-sm: 8px;
      --radius-md: 16px;
      --radius-lg: 24px;
      --radius-full: 9999px;
      --transition: all 0.3s cubic-bezier(0.165, 0.84, 0.44, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', 'Noto Sans TC', sans-serif;
      color: var(--text-main);
      background: #F8FAFC;
      line-height: 1.6;
    }

    .page-hero {
      padding: 140px 40px 50px;
      background: linear-gradient(135deg, var(--primary-navy), var(--brand-blue));
      color: var(--surface-white);
      margin-top: var(--utility-h);
    }

    .hero-container {
      max-width: 1000px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 40px;
      align-items: center;
    }

    .hero-title {
      font-size: 2.3rem;
      font-weight: 800;
      margin-bottom: 14px;
    }

    .hero-desc {
      font-size: 1rem;
      color: rgba(255, 255, 255, 0.85);
      line-height: 1.7;
      margin-bottom: 20px;
    }

    .product-hero-img {
      width: 100%;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-lg);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .section {
      padding: 40px 40px;
    }

    .compact-spec-container {
      max-width: 1400px;
      margin: 0 auto;
    }

    /* Filter Pills Bar */
    .filter-pills-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-bottom: 35px;
      background: #FFFFFF;
      padding: 16px;
      border-radius: 16px;
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
      position: sticky;
      top: 90px;
      z-index: 900;
      backdrop-filter: blur(12px);
    }

    .filter-btn {
      background: #F1F5F9;
      border: 1px solid #CBD5E1;
      color: var(--text-main);
      padding: 8px 18px;
      border-radius: var(--radius-full);
      font-size: 0.86rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .filter-btn:hover {
      border-color: var(--brand-blue);
      color: var(--brand-blue);
      background: #EFF6FF;
    }

    .filter-btn.active {
      background: var(--primary-navy);
      color: #FFFFFF;
      border-color: var(--primary-navy);
      box-shadow: 0 4px 10px rgba(10, 37, 64, 0.2);
    }

    /* INDIVIDUAL PRODUCT BLOCK */
    .cat-spec-block {
      background: #FFFFFF;
      border: 1px solid #CBD5E1;
      border-radius: 16px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.05);
      margin-bottom: 45px;
      overflow: hidden;
      scroll-margin-top: 170px;
      transition: all 0.3s ease;
    }

    .cat-spec-header {
      background: #0A2540;
      color: #FFFFFF;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .cat-spec-title {
      font-size: 1.2rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .cat-spec-sub {
      font-size: 0.82rem;
      color: #94A3B8;
      font-weight: 600;
    }

    /* SMART ADAPTIVE SCALE RAMP LAYOUTS */
    .scale-ramp-container {
      background: linear-gradient(135deg, #0A2540, #004580);
      padding: 24px 24px;
      border-bottom: 1px solid #CBD5E1;
    }

    .scale-ramp-title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .scale-ramp-title {
      font-size: 0.95rem;
      font-weight: 800;
      color: #00A8FF;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* 1. FEWER SIZES (e.g. 7~9 sizes for Heat Bags): Generous, Spacious 1-Row Stretch Layout */
    .track-spacious {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      padding: 15px 5px 10px;
      width: 100%;
    }

    .track-spacious .scale-ramp-item {
      flex: 1;
      min-width: 110px;
      padding: 14px 10px;
    }

    /* 2. MANY SIZES (e.g. 14 sizes for Zipper Bags 00號~12號): Smart Grid Wrap Layout */
    .track-grid-wrap {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: center;
      gap: 14px;
      padding: 15px 5px 10px;
    }

    .track-grid-wrap .scale-ramp-item {
      width: calc(14.28% - 12px);
      min-width: 110px;
      padding: 14px 10px;
    }

    .scale-ramp-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .scale-ramp-item:hover, .scale-ramp-item.active {
      background: rgba(0, 168, 255, 0.22);
      border-color: #00A8FF;
      transform: translateY(-4px);
      box-shadow: 0 8px 20px rgba(0, 168, 255, 0.25);
    }

    .scale-bag-shape {
      max-width: 100%;
      flex: 0 0 auto;
      border: 2px dashed #00A8FF;
      background: rgba(0, 168, 255, 0.18);
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
      position: relative;
      transition: all 0.3s ease;
    }

    .scale-bag-tag {
      font-size: 0.8rem;
      font-weight: 800;
      color: #FFFFFF;
    }

    .scale-dim-label {
      font-size: 0.78rem;
      font-weight: 800;
      color: #00A8FF;
      white-space: nowrap;
      margin-top: 4px;
    }

    .scale-qty-label {
      font-size: 0.72rem;
      color: rgba(255, 255, 255, 0.75);
      margin-top: 2px;
      white-space: nowrap;
    }

    /* 3. TRUE PROPORTIONAL SINGLE-ROW RAMP (資訊直接放在卡片上，不再重複表格) */
    .track-ramp-scroll {
      display: flex;
      align-items: flex-end;
      gap: 12px;
      justify-content: safe center;
      padding: 15px 4px 12px;
      overflow-x: auto;
      scrollbar-width: thin;
    }

    .track-ramp-scroll .scale-ramp-item {
      flex: 0 0 auto;
      width: 118px;
      padding: 12px 8px;
    }

    .scale-no-pill {
      font-size: 0.86rem;
      font-weight: 900;
      color: #FFFFFF;
      background: rgba(0, 168, 255, 0.28);
      border: 1px solid rgba(0, 168, 255, 0.55);
      padding: 2px 12px;
      border-radius: 6px;
      white-space: nowrap;
      margin-bottom: 10px;
    }

    .scale-shape-slot {
      height: 190px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .scale-ramp-hint {
      font-size: 0.78rem;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.6);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-quote-dark {
      margin-top: 10px;
      width: 100%;
      justify-content: center;
      background: rgba(0, 168, 255, 0.16);
      border: 1px solid rgba(0, 168, 255, 0.5);
      color: #BAE6FD;
      padding: 5px 8px;
      border-radius: 6px;
      font-size: 0.74rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .btn-quote-dark:hover {
      background: #00A8FF;
      color: #0A2540;
      border-color: #00A8FF;
    }

    .btn-quote-dark.added {
      background: #10B981;
      color: #FFFFFF;
      border-color: #10B981;
    }

    /* COMPACT TABLE */
    .compact-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }

    .compact-table th {
      background: #F1F5F9;
      color: #334155;
      font-weight: 700;
      font-size: 0.82rem;
      text-transform: uppercase;
      padding: 10px 24px;
      text-align: left;
      border-bottom: 1px solid #CBD5E1;
    }

    .compact-table td {
      padding: 11px 24px;
      border-bottom: 1px solid #E2E8F0;
      color: #1E293B;
      font-weight: 600;
    }

    .compact-table tr:last-child td {
      border-bottom: none;
    }

    .compact-table tr:nth-child(even) td {
      background: #F8FAFC;
    }

    .compact-table tr:hover td {
      background: #EFF6FF;
    }

    .tag-size {
      display: inline-block;
      background: #E0F2FE;
      color: #0284C7;
      font-weight: 800;
      padding: 2px 10px;
      border-radius: 4px;
      font-size: 0.82rem;
    }

    .tag-qty {
      display: inline-block;
      background: #FEF3C7;
      color: #D97706;
      font-weight: 800;
      padding: 2px 10px;
      border-radius: 4px;
      font-size: 0.82rem;
    }

    /* RFQ QUOTE BASKET STYLING */
    .btn-quote-add {
      background: #EFF6FF;
      border: 1px solid #BFDBFE;
      color: var(--brand-blue);
      padding: 5px 14px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-quote-add:hover {
      background: var(--brand-blue);
      color: #FFFFFF;
      border-color: var(--brand-blue);
    }

    .btn-quote-add.added {
      background: #10B981;
      color: #FFFFFF;
      border-color: #10B981;
    }

    tr.row-selected td {
      background: #F0FDF4 !important;
    }

    .rfq-floating-basket {
      position: fixed;
      bottom: 25px;
      right: 25px;
      z-index: 9999;
      background: #0A2540;
      color: #FFFFFF;
      border: 1px solid #00A8FF;
      border-radius: 16px;
      padding: 14px 22px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
      display: flex;
      align-items: center;
      gap: 18px;
      transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      transform: translateY(100px);
      opacity: 0;
      pointer-events: none;
    }

    .rfq-floating-basket.active {
      transform: translateY(0);
      opacity: 1;
      pointer-events: auto;
    }

    .basket-info {
      font-size: 0.92rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .basket-clear-btn {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.35);
      color: rgba(255, 255, 255, 0.8);
      padding: 7px 14px;
      border-radius: 9999px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .basket-clear-btn:hover {
      border-color: #00A8FF;
      color: #00A8FF;
    }

    .basket-count-badge {
      background: #00A8FF;
      color: #0A2540;
      padding: 2px 8px;
      border-radius: var(--radius-full);
      font-weight: 900;
      font-size: 0.85rem;
    }

    .basket-submit-btn {
      background: linear-gradient(135deg, #10B981, #059669);
      color: #FFFFFF;
      border: none;
      padding: 8px 18px;
      border-radius: var(--radius-full);
      font-size: 0.86rem;
      font-weight: 800;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .basket-submit-btn:hover {
      background: #059669;
      transform: scale(1.04);
    }

    .footer {
      background: var(--primary-navy);
      color: rgba(255, 255, 255, 0.7);
      padding: 60px 40px 30px;
      font-size: 0.9rem;
    }

    .footer-bottom {
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      margin-top: 40px;
      padding-top: 20px;
      text-align: center;
    }
  </style>

          嚴格採用 100% Virgin 食品級高溫聚乙烯全新塑料，無毒無味，完全遵守 FDA 標準。提供平裝耐熱袋、卷裝耐熱袋與蔬果袋（四兩至 15斤），具備從小到大等比例視覺對比牆。

  <script>
    // RFQ Basket Management

    // SMART PRODUCT FILTER & FOCUS NAVIGATION
    function filterCategory(category, btn) {
      const buttons = document.querySelectorAll('.filter-btn');
      buttons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      const blocks = document.querySelectorAll('.spec-block');
      let targetBlock = null;

      blocks.forEach(block => {
        if (category === 'all') {
          block.style.display = 'block';
        } else {
          if (block.id === `cat-${category}`) {
            block.style.display = 'block';
            targetBlock = block;
          } else {
            block.style.display = 'none';
          }
        }
      });

      if (targetBlock) {
        const headerOffset = 160;
        const elementPosition = targetBlock.getBoundingClientRect().top;
        const offsetPosition = elementPosition + window.pageYOffset - headerOffset;

        window.scrollTo({
          top: offsetPosition,
          behavior: 'smooth'
        });
      } else if (category === 'all') {
        const firstBlock = document.querySelector('.spec-block');
        if (firstBlock) {
          const headerOffset = 160;
          const elementPosition = firstBlock.getBoundingClientRect().top;
          const offsetPosition = elementPosition + window.pageYOffset - headerOffset;
          window.scrollTo({ top: offsetPosition, behavior: 'smooth' });
        }
      }
    }

    document.addEventListener("DOMContentLoaded", function () {
      // Add active toggle for scale ramp items
      document.querySelectorAll('.scale-ramp-item').forEach(item => {
        item.addEventListener('click', function () {
          const parentTrack = this.parentElement;
          parentTrack.querySelectorAll('.scale-ramp-item').forEach(i => i.classList.remove('active'));
          this.classList.add('active');
        });
      });

      const navItems = document.querySelectorAll(".nav-item");
      navItems.forEach(item => {
        let timer;
        const panel = item.querySelector(".mega-menu-panel-6cat");
        if (!panel) return;

        item.addEventListener("mouseenter", function () {
          clearTimeout(timer);
          item.classList.add("open-dropdown");
        });

        item.addEventListener("mouseleave", function () {
          timer = setTimeout(() => {
            item.classList.remove("open-dropdown");
          }, 250);
        });
      });

      document.addEventListener("click", function (e) {
        if (!e.target.closest(".nav-item")) {
          document.querySelectorAll(".nav-item.open-dropdown").forEach(i => i.classList.remove("open-dropdown"));
        }
      });
    });

          document.querySelectorAll("[data-tw]").forEach(el => {
        const text = el.getAttribute(`data-${lang}`);
        if (text) {
          const icon = el.querySelector('i');
          if (icon) {
            const iconClone = icon.cloneNode(true);
            el.innerHTML = '';
            el.appendChild(iconClone);
            el.appendChild(document.createTextNode(' ' + text));
          } else {
            el.innerText = text;
          }
        }
      });
    }

          </script>
  <script>
    /* 跨頁詢價籃：勾選的規格存在 localStorage，切換產品頁持續累積 */
    (function () {
      var KEY = 'inteplastQuoteBasket';
      function read() {
        try { var raw = JSON.parse(localStorage.getItem(KEY) || '[]'); return Array.isArray(raw) ? raw.filter(function (v) { return typeof v === 'string'; }) : []; }
        catch (e) { return []; }
      }
      var selected = new Set(read());
      function persist() { try { localStorage.setItem(KEY, JSON.stringify(Array.from(selected))); } catch (e) { } }
      function allBtns() { return document.querySelectorAll('.btn-quote-add, .btn-quote-dark'); }
      function specOf(btn) {
        var m = (btn.getAttribute('onclick') || '').match(/toggleQuoteItem\('([\s\S]*?)',\s*this\)/);
        return m ? m[1] : (btn.getAttribute('data-quote-spec') || null);
      }
      function paint(btn, on) {
        btn.classList.toggle('added', on);
        btn.innerHTML = on ? '<i class="fa-solid fa-check"></i> 已加入詢價' : '<i class="fa-solid fa-plus"></i> 勾選詢價';
        var row = btn.closest ? btn.closest('tr') : null;
        if (row) row.classList.toggle('row-selected', on);
      }
      function refresh() {
        var badge = document.getElementById('quoteCountBadge');
        if (badge) badge.innerText = selected.size;
        var basket = document.getElementById('rfqFloatingBasket');
        if (basket) basket.classList.toggle('active', selected.size > 0);
      }
      var lastBtn = null, lastAt = 0;
      function handle(spec, btn) {
        if (!spec) return;
        var now = Date.now();
        if (btn && btn === lastBtn && now - lastAt < 120) return; // 避免 inline onclick 與委派重複觸發
        lastBtn = btn; lastAt = now;
        if (selected.has(spec)) selected.delete(spec); else selected.add(spec);
        persist();
        if (btn) paint(btn, selected.has(spec));
        refresh();
      }
      window.toggleQuoteItem = function (spec, btn) { handle(spec, btn); };
      window.clearQuoteBasket = function () {
        selected.clear(); persist();
        allBtns().forEach(function (b) { paint(b, false); });
        refresh();
      };
      window.goToRfqPage = function () {
        window.location.href = '../contact.html?specs=' + encodeURIComponent(Array.from(selected).join(' ; '));
      };
      // 備援：即使 inline onclick 未執行（被攔截或改寫）也能作用
      function delegated(e) {
        var btn = e.target && e.target.closest ? e.target.closest('.btn-quote-add, .btn-quote-dark') : null;
        if (!btn) return;
        handle(specOf(btn), btn);
      }
      ['pointerdown', 'mousedown', 'click'].forEach(function (evt) {
        document.addEventListener(evt, delegated, true);
