<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scale Sheet 產品專頁 | 臺灣營德 Inteplast Taiwan</title>
  <meta name="description" content="臺灣營德 Scale Sheet 產品專頁。">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- 導覽樣式的唯一來源。id 必須是 site-navbar-css，navbar.js 才不會再注入第二份 -->
  <link rel="stylesheet" href="../src/navbar.css" id="site-navbar-css">

  <style>
    /* 只放這一頁自己的樣式。
       .header / .top-utility-bar / .nav-* / .mega-* / .search-* 一律不要出現在這裡，
       它們住在 src/navbar.css。 */
    :root {
      --brand-blue-hover: #003d75;
      --accent-emerald: #10B981;
      --bg-light: #F8FAFC;
      --shadow-md: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
      --shadow-lg: 0 20px 40px -15px rgba(10, 37, 64, 0.15);
      --radius-sm: 8px;
      --radius-lg: 24px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', 'Noto Sans TC', sans-serif; color: var(--text-main); background: var(--bg-light); line-height: 1.6; }

    /* 固定頁首的高度用變數算，頂欄高度改了這裡不用跟著改 */
    .page-hero {
      padding: calc(var(--utility-h) + var(--header-h) + 40px) 40px 50px;
      background: linear-gradient(135deg, var(--primary-navy), var(--brand-blue));
      color: var(--surface-white);
    }
    .hero-container { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 1.2fr 1fr; gap: 40px; align-items: center; }
    .hero-eyebrow { color: var(--accent-azure); font-size: 0.85rem; font-weight: 700; letter-spacing: 1px; }
    .hero-title { font-size: 2.3rem; font-weight: 800; margin-bottom: 14px; }
    .hero-desc { font-size: 1rem; color: rgba(255, 255, 255, 0.85); line-height: 1.7; margin-bottom: 20px; }
    .product-hero-img { width: 100%; border-radius: var(--radius-md); box-shadow: var(--shadow-lg); border: 1px solid rgba(255, 255, 255, 0.2); }

    .section { padding: 80px 40px; }
    .coming-soon-card {
      max-width: 800px; margin: 0 auto; background: var(--surface-white); border: 1px solid var(--border-color);
      border-radius: 20px; padding: 60px 40px; text-align: center; box-shadow: var(--shadow-md);
    }
    .coming-soon-icon { font-size: 3.5rem; color: var(--brand-blue); margin-bottom: 20px; }
    .coming-soon-title { font-size: 1.6rem; font-weight: 800; color: var(--primary-navy); margin-bottom: 12px; }
    .coming-soon-desc { font-size: 1rem; color: var(--text-muted); max-width: 550px; margin: 0 auto 30px; }

    .footer { background: var(--primary-navy); color: rgba(255, 255, 255, 0.7); padding: 60px 40px 30px; font-size: 0.9rem; }
    .footer-bottom { border-top: 1px solid rgba(255, 255, 255, 0.1); margin-top: 40px; padding-top: 20px; text-align: center; }
  </style>
  <link rel="stylesheet" href="../src/responsive.css">
</head>
<body>
  <!-- 頁首由 src/navbar.js 注入（頂欄、選單、搜尋按鈕、語言鈕、CTA）。
       頁面內不要再手寫一份，否則兩份頁首會打架。 -->
  <div id="site-header-component"></div>
  <script src="../src/navbar.js"></script>
  <script src="../src/site-year.js"></script>

  <section class="page-hero">
    <div class="hero-container">
      <div>
        <span class="hero-eyebrow">SCALE SHEET PRODUCT SERIES</span>
        <h1 class="hero-title">Scale Sheet 產品專頁</h1>
        <p class="hero-desc">
          臺灣營德生產之 Scale Sheet 薄膜產品系列。若您有大宗採購或規格諮詢需求，歡迎與專員聯繫。
        </p>
        <a href="../contact.html" class="rfq-btn"><i class="fa-solid fa-calculator"></i> 專人諮詢與詢價</a>
      </div>
      <div>
        <img src="../src/scale sheet.png" alt="Scale Sheet 展示" class="product-hero-img" data-hero-img loading="lazy">
      </div>
    </div>
  </section>

  <section class="section">
    <div class="coming-soon-card">
      <div class="coming-soon-icon"><i class="fa-solid fa-folder-open"></i></div>
      <h2 class="coming-soon-title">Scale Sheet</h2>
      <p class="coming-soon-desc">
        若您有 Scale Sheet 產品之大宗採購、外銷客製或規格諮詢需求，歡迎隨時與我們的專員聯繫！
      </p>
      <a href="../contact.html" class="rfq-btn" style="display: inline-flex;"><i class="fa-solid fa-paper-plane"></i> 聯絡業務專員專人諮詢</a>
    </div>
  </section>

  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        © {{year}} INTEPLAST TAIWAN CORPORATION. All Rights Reserved.
      </div>
    </div>
  </footer>

  <!-- 這一頁不再自帶語言切換與 Excel 讀取程式碼：
       語言切換 → src/site-lang.js
       規格資料 → website-data.js + data-map.js + spec-render.js
       （原本的 SheetJS 與 src/data/products.xlsx 讀取已移除，該檔案不存在，只會 console.log） -->
  <script src="../src/data/website-data.js"></script>
  <script src="../src/data-map.js"></script>
  <script src="../src/spec-render.js"></script>
  <script src="../src/site-search.js"></script>
  <script src="../src/site-lang.js"></script>
  <script src="../src/mobile-nav.js"></script>
</body>
</html>
