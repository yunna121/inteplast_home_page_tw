<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>語意搜尋向量產生 | 臺灣營德</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root { --navy: #0A2540; --blue: #00529B; --line: #E2E8F0; --muted: #64748B; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 40px 20px 80px; font-family: 'Noto Sans TC', sans-serif; color: var(--navy); background: #F8FAFC; }
  .wrap { max-width: 820px; margin: 0 auto; }
  h1 { font-size: 1.6rem; font-weight: 900; margin: 0 0 6px; }
  .sub { color: var(--muted); font-size: 0.92rem; font-weight: 600; margin-bottom: 28px; line-height: 1.7; }
  .card { background: #FFF; border: 1px solid var(--line); border-radius: 16px; padding: 26px 28px; margin-bottom: 20px; }
  .card h2 { font-size: 1.02rem; font-weight: 900; margin: 0 0 4px; }
  .card p { color: var(--muted); font-size: 0.86rem; font-weight: 600; line-height: 1.65; margin: 0 0 18px; }
  button { background: var(--blue); color: #FFF; border: none; border-radius: 10px; padding: 13px 26px;
    font-family: inherit; font-size: 0.94rem; font-weight: 800; cursor: pointer; }
  button:disabled { background: #94A3B8; cursor: not-allowed; }
  button.ghost { background: #FFF; color: var(--blue); border: 1px solid var(--line); }
  .actions { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .note { background: #FFFBEB; border: 1px solid #FDE68A; border-radius: 10px; padding: 14px 16px;
    font-size: 0.84rem; font-weight: 700; line-height: 1.65; margin-bottom: 18px; }
  .bar { height: 8px; background: #E2E8F0; border-radius: 9999px; overflow: hidden; margin: 16px 0 6px; }
  .bar i { display: block; height: 100%; width: 0; background: var(--blue); transition: width 0.2s ease; }
  #log { background: #0A2540; color: #CBD5E1; border-radius: 12px; padding: 18px 20px; font-family: ui-monospace, monospace;
    font-size: 0.82rem; line-height: 1.8; min-height: 120px; white-space: pre-wrap; word-break: break-all; }
  #log .ok { color: #6EE7B7; }
  #log .err { color: #FCA5A5; }
  input[type=text] { width: 100%; padding: 11px 14px; border: 1px solid var(--line); border-radius: 9px;
    font-family: ui-monospace, monospace; font-size: 0.86rem; margin-bottom: 4px; }
  .try { display: flex; gap: 10px; margin-top: 10px; }
  .try input { margin: 0; }
  .try button { padding: 11px 20px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>語意搜尋向量產生</h1>
  <div class="sub">
    在你的瀏覽器裡直接跑語意模型，把產品資料算成向量存成一個檔案。<br>
    這樣網站就能理解「可以裝熱湯的袋子」這種說法，不需要人工維護同義詞、也不需要任何 API 金鑰或月費。
  </div>

  <div class="card">
    <h2>1. 產生向量</h2>
    <p>第一次會下載模型（約 40MB，之後瀏覽器會快取）。全部算完大約一到三分鐘，視你的電腦而定。過程完全在本機進行，資料不會傳給任何人。</p>
    <div class="note">算完會自動下載 <b>embeddings.json</b>。請把它放到專案的 <b>src/data/</b> 資料夾，然後和其他檔案一起 push。</div>
    <div class="actions">
      <button type="button" id="btnRun">開始產生</button>
      <button type="button" id="btnPreview" class="ghost">先看要處理幾筆</button>
    </div>
    <div class="bar"><i id="bar"></i></div>
  </div>

  <div class="card">
    <h2>2. 產生後可以先試搜</h2>
    <p>用整句話試試看，例如「可以裝熱湯的袋子」「不會漏的垃圾袋」「秤重用的紙」。</p>
    <div class="try">
      <input type="text" id="q" placeholder="輸入一句話試搜" spellcheck="false">
      <button type="button" id="btnTry" class="ghost">試搜</button>
    </div>
  </div>

  <div id="log">等待操作…</div>
</div>

<script src="../src/data/products-data.js"></script>
<script src="../src/search-records.js"></script>
<script type="module">
import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.2';

env.allowLocalModels = false;

const MODEL = 'Xenova/multilingual-e5-small';   // 多語（含中文）小型模型，384 維
const logEl = document.getElementById('log');
const barEl = document.getElementById('bar');

function log(msg, cls) {
  logEl.innerHTML += '\n' + (cls ? `<span class="${cls}">${msg}</span>` : msg);
  logEl.scrollTop = logEl.scrollHeight;
}
function reset() { logEl.innerHTML = ''; }
function progress(p) { barEl.style.width = Math.round(p * 100) + '%'; }

let extractor = null;
let vectors = null;   // 試搜用

async function getExtractor() {
  if (extractor) return extractor;
  log('載入模型 ' + MODEL + '…（第一次要下載約 40MB）');
  extractor = await pipeline('feature-extraction', MODEL, {
    dtype: 'q8',
    progress_callback: (d) => {
      if (d.status === 'progress' && d.total) progress(0.35 * (d.loaded / d.total));
    }
  });
  log('模型就緒', 'ok');
  return extractor;
}

/* e5 系列模型要求加前綴：文件用 passage:、查詢用 query: */
async function embed(texts, prefix) {
  const ex = await getExtractor();
  const out = await ex(texts.map(t => prefix + ': ' + t), { pooling: 'mean', normalize: true });
  return out.tolist();
}

document.getElementById('btnPreview').addEventListener('click', () => {
  reset();
  const recs = window.buildSearchRecords();
  const by = {};
  recs.forEach(r => { by[r.type] = (by[r.type] || 0) + 1; });
  log(`共 ${recs.length} 筆：產品 ${by.product || 0}、頁面 ${by.page || 0}`, 'ok');
  log('範例文字：\n' + window.searchRecordText(recs[0]).slice(0, 200) + '…');
});

document.getElementById('btnRun').addEventListener('click', async (e) => {
  reset();
  const btn = e.currentTarget;
  btn.disabled = true;
  try {
    const recs = window.buildSearchRecords();
    if (!recs.length) throw new Error('讀不到產品資料，請確認 products-data.js 在 src/data/ 底下');
    log(`要處理 ${recs.length} 筆`);

    const items = [];
    const BATCH = 8;
    for (let i = 0; i < recs.length; i += BATCH) {
      const chunk = recs.slice(i, i + BATCH);
      const vecs = await embed(chunk.map(window.searchRecordText), 'passage');
      chunk.forEach((r, j) => {
        items.push({
          id: r.objectID,
          type: r.type,
          title: r.title,
          category: r.category,
          desc: r.desc,
          icon: r.icon,
          url: r.url,
          // 三位小數就夠了，檔案小一半以上，相似度排序不受影響
          vec: vecs[j].map(v => Math.round(v * 1000) / 1000)
        });
      });
      progress(0.35 + 0.65 * ((i + chunk.length) / recs.length));
      log(`已處理 ${items.length} / ${recs.length}`);
    }

    vectors = items;
    const payload = { model: MODEL, dim: items[0].vec.length, prefix: 'e5', built: new Date().toISOString(), items };
    const blob = new Blob([JSON.stringify(payload)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'embeddings.json';
    a.click();
    URL.revokeObjectURL(a.href);

    progress(1);
    log(`完成！已下載 embeddings.json（${(blob.size / 1024).toFixed(0)} KB）`, 'ok');
    log('請放到 src/data/ 後 push，網站的語意搜尋就會生效。', 'ok');
  } catch (err) {
    log('失敗：' + err.message, 'err');
  }
  btn.disabled = false;
});

document.getElementById('btnTry').addEventListener('click', async () => {
  const q = document.getElementById('q').value.trim();
  if (!q) return;
  if (!vectors) return log('請先按「開始產生」，或重新整理後直接試搜（需要先算過向量）', 'err');
  reset();
  const [qv] = await embed([q], 'query');
  const scored = vectors.map(it => {
    let s = 0;
    for (let i = 0; i < qv.length; i++) s += qv[i] * it.vec[i];
    return { it, s };
  }).sort((a, b) => b.s - a.s).slice(0, 6);
  log(`「${q}」語意最相近的：`, 'ok');
  scored.forEach(x => log(`  ${x.s.toFixed(3)}　${x.it.title}　${(x.it.desc || '').slice(0, 40)}`));
});
</script>
</body>
</html>
