<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>導覽一致性量測（模擬 1440px）</title>
<style>
  body { margin: 0; padding: 20px; background: #0f172a; color: #e2e8f0; font: 14px/1.7 ui-monospace, monospace; }
  h1 { font-size: 15px; color: #7dd3fc; margin: 0 0 4px; }
  p { color: #94a3b8; margin: 0 0 16px; font-size: 12px; }
  table { border-collapse: collapse; }
  th, td { padding: 5px 12px; border-bottom: 1px solid #1e293b; text-align: right; white-space: nowrap; }
  th { color: #7dd3fc; font-weight: 400; }
  td:first-child, th:first-child { text-align: left; }
  .ok { color: #4ade80; }
  .bad { color: #f87171; }
  iframe { position: absolute; left: -9999px; width: 1440px; height: 400px; border: 0; }
</style>
</head>
<body>
  <h1>導覽一致性量測</h1>
  <p>每頁在 1440px 寬下量 .nav-menu 的左緣／中心與 header 高度。相同 = 每頁導覽真的是同一個。</p>
  <table id="out"><thead><tr><th>頁面</th><th>選單左緣</th><th>選單中心</th><th>選單寬</th><th>header 高</th><th>logo 字級</th></tr></thead><tbody></tbody></table>
  <div id="frames"></div>
<script>
const BASE = '../';   // 這支工具放在 tools/ 之下，頁面在上一層
const PAGES = ['index.html','about.html','contact.html','sustainability.html','products/index.html','products/can-liners.html','products/draw-tape.html','products/heat-bags.html','products/accessories.html','products/specialty.html','products/stretch-films.html'];
const tbody = document.querySelector('#out tbody');
const rows = [];

function measure(doc) {
  const menu = doc.querySelector('.nav-menu');
  const header = doc.querySelector('.header');
  const logo = doc.querySelector('.logo-text-tw');
  if (!menu || !header) return null;
  const m = menu.getBoundingClientRect();
  return {
    left: Math.round(m.left),
    center: Math.round(m.left + m.width / 2),
    width: Math.round(m.width),
    h: Math.round(header.getBoundingClientRect().height),
    fs: logo ? getComputedStyle(logo).fontSize : '—'
  };
}

let done = 0;
PAGES.forEach(function (p) {
  const f = document.createElement('iframe');
  f.src = BASE + p;
  f.onload = function () {
    setTimeout(function () {
      let r = null;
      try { r = measure(f.contentDocument); } catch (e) {}
      rows.push([p, r]);
      done++;
    }, 350);
  };
  document.getElementById('frames').appendChild(f);
});

setTimeout(function () { if (!rendered) render(); }, 3500);
var rendered = false;
function render() {
  rendered = true;
  rows.sort(function (a, b) { return PAGES.indexOf(a[0]) - PAGES.indexOf(b[0]); });
  const centers = rows.filter(function (r) { return r[1]; }).map(function (r) { return r[1].center; });
  const base = centers[0];
  rows.forEach(function (r) {
    const tr = document.createElement('tr');
    const v = r[1];
    const cells = v
      ? [r[0], v.left, v.center, v.width, v.h, v.fs]
      : [r[0], '—', '—', '—', '—', '（量不到）'];
    cells.forEach(function (c, i) {
      const td = document.createElement('td');
      td.textContent = c;
      if (i === 2 && v) td.className = Math.abs(v.center - base) <= 1 ? 'ok' : 'bad';
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  const spread = Math.max.apply(null, centers) - Math.min.apply(null, centers);
  const p = document.createElement('p');
  p.style.marginTop = '14px';
  p.className = spread <= 1 ? 'ok' : 'bad';
  p.textContent = '選單中心最大差異：' + spread + 'px（0 = 完全一致）';
  document.body.appendChild(p);
}
</script>
</body>
</html>
