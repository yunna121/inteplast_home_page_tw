<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  body { margin: 0; font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif; color: #142638; background: #e9edf3; line-height: 1.7; font-size: 15px; }
  a { color: #00529b; text-decoration: none; }
  a:hover { color: #0b4f83; }
</style>
</helmet>

<div style="min-height: 100vh; padding: 48px 24px; display: grid; place-items: center; background: #e9edf3">
  <div style="position: relative; overflow: hidden; width: 100%; max-width: 940px; display: grid; grid-template-columns: 1fr 1px 1fr; align-items: stretch; background: #e9edf3; border-radius: 26px; box-shadow: 16px 16px 40px rgba(163,177,198,0.55), -16px -16px 40px rgba(255,255,255,0.9)">

    <div style="position: absolute; top: -120px; left: -60px; width: 340px; height: 340px; border-radius: 50%; box-shadow: inset 10px 10px 22px rgba(163,177,198,0.28), inset -10px -10px 22px rgba(255,255,255,0.75); pointer-events: none"></div>
    <div style="position: absolute; bottom: -160px; left: -110px; width: 320px; height: 320px; border-radius: 50%; box-shadow: inset 10px 10px 22px rgba(163,177,198,0.24), inset -10px -10px 22px rgba(255,255,255,0.7); pointer-events: none"></div>

    <div style="position: relative; padding: 60px 52px; display: flex; flex-direction: column; justify-content: center; gap: 22px; text-align: center; align-items: center">
      <div style="width: 68px; height: 68px; display: grid; place-items: center; border-radius: 20px; background: #e9edf3; box-shadow: 7px 7px 16px rgba(163,177,198,0.6), -7px -7px 16px rgba(255,255,255,0.95)">
        <img src="src/inteplast-logo-blue.svg" alt="INTEPLAST" style="width: 34px; height: 34px">
      </div>
      <div style="display: flex; flex-direction: column; gap: 10px">
        <div style="font-size: 1.85rem; font-weight: 900; line-height: 1.3; letter-spacing: -0.01em; color: #142638">網站管理系統</div>
        <div style="font-family: 'Barlow Condensed', 'Noto Sans TC', sans-serif; font-size: 0.84rem; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: #3f5a72">Inteplast Taiwan</div>
      </div>
      <a href="#" style="display: inline-flex; align-items: center; gap: 8px; margin-top: 6px; padding: 10px 20px; border-radius: 99px; background: #e9edf3; font-size: 0.84rem; font-weight: 700; color: #4a6b88; box-shadow: 5px 5px 12px rgba(163,177,198,0.55), -5px -5px 12px rgba(255,255,255,0.95)"><i class="fa-solid fa-arrow-up-right-from-square"></i> 前往網站</a>
    </div>

    <div style="background: linear-gradient(180deg, rgba(163,177,198,0) 0%, rgba(163,177,198,0.5) 22%, rgba(163,177,198,0.5) 78%, rgba(163,177,198,0) 100%)"></div>

    <div style="position: relative; padding: 60px 52px; display: flex; flex-direction: column; justify-content: center; gap: 24px">
      <div style="font-size: 1.5rem; font-weight: 900; letter-spacing: -0.01em; text-align: center; color: #142638">登入</div>

      <div style="display: flex; flex-direction: column; gap: 14px">
        <div style="position: relative; display: flex; align-items: center; border-radius: 99px; background: #e9edf3; box-shadow: inset 4px 4px 9px rgba(163,177,198,0.55), inset -4px -4px 9px rgba(255,255,255,0.95)">
          <i class="fa-solid fa-user" style="position: absolute; left: 20px; font-size: 0.85rem; color: #5f7182"></i>
          <input type="text" placeholder="帳號" autocomplete="username" style="width: 100%; min-height: 52px; padding: 12px 22px 12px 48px; background: transparent; border: 0; outline: 0; border-radius: 99px; font: inherit; font-size: 0.95rem; color: #142638">
        </div>
        <div style="position: relative; display: flex; align-items: center; border-radius: 99px; background: #e9edf3; box-shadow: inset 4px 4px 9px rgba(163,177,198,0.55), inset -4px -4px 9px rgba(255,255,255,0.95)">
          <i class="fa-solid fa-lock" style="position: absolute; left: 20px; font-size: 0.85rem; color: #5f7182"></i>
          <input type="password" placeholder="密碼" autocomplete="current-password" style="width: 100%; min-height: 52px; padding: 12px 22px 12px 48px; background: transparent; border: 0; outline: 0; border-radius: 99px; font: inherit; font-size: 0.95rem; color: #142638">
        </div>
      </div>

      <div style="display: flex; align-items: center; justify-content: center; gap: 7px; min-height: 22px; font-size: 0.88rem; font-weight: 700; color: #142638">
        <i class="fa-solid fa-circle-info"></i>
        <span>已登出，請重新登入。</span>
      </div>

      <button type="button" style="align-self: center; display: inline-flex; align-items: center; justify-content: center; gap: 9px; min-width: 200px; min-height: 52px; padding: 12px 30px; border: 0; border-radius: 99px; background: linear-gradient(135deg, #00529b, #0b4f83); color: #fff; font: inherit; font-size: 0.95rem; font-weight: 700; letter-spacing: 0.06em; cursor: pointer; box-shadow: 7px 7px 16px rgba(0,82,155,0.32), -6px -6px 14px rgba(255,255,255,0.9)" style-hover="background: linear-gradient(135deg, #0b4f83, #073457)" style-active="box-shadow: inset 4px 4px 10px rgba(0,0,0,0.28)"><i class="fa-solid fa-right-to-bracket"></i>登入</button>

    </div>
  </div>
</div>
</x-dc>
</body>
</html>
